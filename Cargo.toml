[workspace]
resolver = "2"
members = [
    "src/hwdaemon",
    "src/desktopd",
    "src/solus-cli",
    "src/stored",
    "src/gpu-setupd",
    "src/system-daemon",
    "src/ai-daemon",
    "src/installer-detect",
    "src/integration-engine",
    "src/snapshot-manager",
    "src/solus-rust-tools/solus-pkg",
    "src/solus-rust-tools/solus-update-manager",
    "src/solus-rust-tools/solus-driver-manager",
    "src/solus-recovery-rs",
    "src/solus-service-manager-rs",
    "src/solus-kernel-manager-rs",
    "src/solus-compat-db",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Solus Linux Team <dev@solus.org>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", features = ["tokio"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.33"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
futures-util = "0.3"
glob = "0.3"
walkdir = "2"
indicatif = "0.17"
