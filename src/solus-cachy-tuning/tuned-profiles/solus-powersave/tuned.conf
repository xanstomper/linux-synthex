[main]
summary=Solus Power Save Profile
include=tuned.conf

[cpu]
governor=powersave
energy_performance_preference=power
min_perf_pct=20

[vm]
transparent_hugepages=madvise

[sysctl]
vm.swappiness=100
vm.vfs_cache_pressure=50
vm.dirty_background_ratio=15
vm.dirty_ratio=30

[disk]
elevator=bfq
.devices=sda,sdb,nvme0n1