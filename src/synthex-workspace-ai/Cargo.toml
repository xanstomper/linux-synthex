[package]
name = "synthex-workspace-ai"
version = "2026.10.0"
edition = "2021"
license.workspace = true
authors.workspace = true
description = "SynthOS multi-workspace AI consciousness — spatial agent assignment, session persistence, KWin/i3 bridge"

[package.metadata.rpm]
name = "synthex-workspace-ai"
summary = "SynthOS workspace AI daemon — multi-workspace AI consciousness and agent coordination"

[dependencies]
# Workspace-shared
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true
chrono.workspace = true

# Crate-specific
x11rb = { version = "0.13", features = ["all-extensions"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
