[package]
name = "synthex-neural-ipc"
version = "2026.10.0"
edition = "2021"
description = "Ultra-fast shared-memory + Unix-socket IPC bus for SynthOS AI agent communication"
license = "GPL-3.0-or-later"
authors = ["SynthOS Team <team@synthex-os.org>"]

[[bin]]
name = "synthex-neural-ipc"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "1"
tracing-subscriber = "0.3"
bytes = "1"
pin-project = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
dashmap = "5"
libc = "0.2"
