# Ananicy rules for Synthex — prioritize gaming and multimedia processes

# Browsers — medium-high priority
"name=firefox"        "nice=-5"  "class=Browser"
"name=firefox-bin"    "nice=-5"  "class=Browser"
"name=chrome"         "nice=-5"  "class=Browser"
"name=chromium"       "nice=-5"  "class=Browser"

# Games — high priority
"name=steam"          "nice=-3"  "class=Game"
"name=steamwebhelper" "nice=5"   "class=Game"
"name=wineserver"     "nice=-3"  "class=Game"
"name=lutris"         "nice=-2"  "class=Game"
"name=heroic"         "nice=-2"  "class=Game"
"name=bottles"        "nice=-2"  "class=Game"
"name=gamescope"      "nice=-5"  "class=Game"

# Launchers — medium priority
"name=epicgames"      "nice=-2"  "class=Game"
"name=origin"         "nice=-2"  "class=Game"
"name=battlenet"      "nice=-2"  "class=Game"

# Creative — medium-high priority
"name=obs"            "nice=-3"  "class=Creative"
"name=obs64"          "nice=-3"  "class=Creative"
"name=blender"        "nice=-2"  "class=Creative"
"name=kdenlive"       "nice=-2"  "class=Creative"
"name=gimp"           "nice=-1"  "class=Creative"
"name=inkscape"       "nice=-1"  "class=Creative"

# Development — medium priority
"name=code"           "nice=0"   "class=Dev"
"name=code-oss"       "nice=0"   "class=Dev"
"name=jetbrains"      "nice=0"   "class=Dev"
"name=cargo"          "nice=5"   "class=Dev"

# Audio — high priority (critical for low latency)
"name=pipewire"       "nice=-11" "class=Audio"
"name=wireplumber"    "nice=-10" "class=Audio"
"name=pipewire-pulse" "nice=-10" "class=Audio"

# System — low priority (background)
"name=backup"         "nice=10"  "class=Background"
"name=borg"           "nice=10"  "class=Background"
"name=rsync"          "nice=10"  "class=Background"
"name=updatedb"       "nice=15"  "class=Background"
"name=locate"         "nice=15"  "class=Background"

# Package management — low priority
"name=dnf"            "nice=10"  "class=Background"
"name=rpm"            "nice=10"  "class=Background"
"name=createrepo"     "nice=15"  "class=Background"
