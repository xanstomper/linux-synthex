# CachyOS-style zstd compression everywhere
# This enables zstd for all compressible operations
# — faster than gzip/xz with comparable ratios

# DNF (RPM) — zstd for package compression
echo "compress-with=zstd" >> /etc/dnf/dnf.conf 2>/dev/null || true
echo "zstd-compression-level=3" >> /etc/dnf/dnf.conf 2>/dev/null || true

# Dracut (initramfs) — zstd
echo "compress=zstd" > /etc/dracut.conf.d/compress.conf

# Systemd journal — zstd
echo "Compress=yes" >> /etc/systemd/journald.conf 2>/dev/null || true

# Btrfs — zstd compression (level 3)
echo "defaults=compress=zstd:3" >> /etc/fstab 2>/dev/null || true

# ZRAM — zstd (faster than lz4 for same ratio)
echo "compression-algorithm = zstd" > /etc/systemd/zram-generator.conf

# RPM build flags
echo '%_compress_binary /usr/bin/zstd' >> ~/.rpmmacros 2>/dev/null || true
echo '%_source_payload w19.zstd' >> ~/.rpmmacros 2>/dev/null || true
echo '%_binary_payload w19.zstd' >> ~/.rpmmacros 2>/dev/null || true
