[package]
name        = "synthex-system-daemon"
version     = "2026.10.0"
edition     = "2021"
description = "SynthOS system daemon — D-Bus IPC, hardware monitoring, profile management"
license     = "GPL-3.0-or-later"
authors     = ["SynthOS Team <team@synthex-os.org>"]

[[bin]]
name = "synthex-system-daemon"
path = "src/main.rs"

[dependencies]
anyhow              = "1"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
toml                = "0.8"
tokio               = { version = "1", features = ["full"] }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
zbus                = { version = "4", default-features = false, features = ["tokio"] }
hostname            = "0.4"
