[package]
name = "synthex-brain"
version = "2026.10.0"
edition = "2021"
description = "SynthOS Brain – persistent AI consciousness daemon with memory graph, context awareness, and agent coordination"
license = "MIT OR Apache-2.0"
authors = ["Synthex Project <dev@getsynthex.org>"]

[dependencies]
# Workspace-shared deps
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
zbus        = { workspace = true }
chrono      = { workspace = true }

# Crate-local deps
thiserror   = "1"
rusqlite    = { version = "0.31", features = ["bundled"] }
uuid        = { version = "1",    features = ["v4"] }
sha2        = "0.10"
hmac        = "0.12"
rand        = "0.8"
tokio-stream = "0.1"
futures     = "0.3"

[[bin]]
name = "synthex-brain"
path = "src/main.rs"
