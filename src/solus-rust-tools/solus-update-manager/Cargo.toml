[package]
name = "solus-update-manager"
version = "0.1.0"
edition = "2021"
description = "Solus Linux update manager — checks, downloads, and applies system updates"
authors = ["Solus Rust Team <rust@solus-project.org>"]

[[bin]]
name = "solus-update-manager"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
zbus = "4"
dirs = "5"
toml = "0.8"
indicatif = "0.17"
sysinfo = "0.31"
