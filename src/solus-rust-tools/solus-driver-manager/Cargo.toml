[package]
name = "solus-driver-manager"
version = "0.1.0"
edition = "2021"
description = "Solus Linux GPU/driver manager — auto-detect and install graphics drivers"
authors = ["Solus Rust Team <rust@solus-project.org>"]

[[bin]]
name = "solus-driver-manager"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
zbus = "4"
sysinfo = "0.31"
