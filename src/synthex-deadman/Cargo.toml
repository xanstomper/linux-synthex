[package]
name        = "synthex-deadman"
version     = "2026.10.0"
edition     = "2021"
description = "SynthOS Dead Man's Switch — session lockdown + webhook alert on missed check-in"
license     = "GPL-3.0-or-later"
authors     = ["SynthOS Team <team@synthex-os.org>"]

[[bin]]
name = "synthex-deadman"
path = "src/main.rs"

[[bin]]
name = "synthex-checkin"
path = "src/checkin.rs"

[dependencies]
anyhow             = "1"
thiserror          = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono             = { version = "0.4", features = ["serde"] }
dirs               = "6"
reqwest            = { version = "0.12", features = ["json"] }
