[package]
name = "synthex-drip-sync"
version = "0.1.0"
edition = "2021"
authors = ["Synthex Project <dev@getsynthex.org>"]
description = "Multi-distro upstream drip-feed update engine for SynthOS"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
sysinfo = "0.30"
