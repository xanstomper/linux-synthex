# /etc/security/limits.d/99-synthex-gaming.conf — Gaming realtime priorities
# Allows the audio/video/gaming group to request realtime scheduling
# This fixes audio crackling and improves game performance

# Realtime priority for audio (PipeWire needs this)
@audio    -   rtprio      95
@audio    -   memlock     unlimited
@audio    -   nice        -19

# Realtime priority for gaming group
@wheel    -   rtprio      80
@wheel    -   memlock     unlimited
@wheel    -   nice        -10

# Video processing (OBS, Kdenlive)
@video    -   rtprio      90
@video    -   memlock     unlimited

# Content creation
@render   -   rtprio      85
@render   -   memlock     unlimited

# Maximum file descriptors for gaming (Steam needs many)
*         -   nofile      1048576
*         -   nproc       1048576

# Core dumps (disabled for gaming stability)
*         -   core        0
