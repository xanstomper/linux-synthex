# /etc/sysctl.d/99-solus-gaming-optimize.conf — Gaming-specific kernel tuning
# Applied on top of the base CachyOS tuning for maximum game performance

# ─── Memory ───────────────────────────────────────────────────────────
# Low swappiness (prefer RAM over swap for games)
vm.swappiness = 10
# Faster cache reclaim
vm.vfs_cache_pressure = 50
# Less dirty pages before writeback (fewer stalls)
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.dirty_writeback_centisecs = 500
# More memory for game allocations
vm.max_map_count = 16777216
vm.overcommit_memory = 1

# ─── File handles ─────────────────────────────────────────────────────
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512

# ─── Networking (lower latency for online gaming) ─────────────────────
# TCP BBR for better throughput + lower latency
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
# Faster TCP connection setup
net.ipv4.tcp_fastopen = 3
# Don't slow start after idle
net.ipv4.tcp_slow_start_after_idle = 0
# Larger socket buffers
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
# More connection backlog
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 4096

# ─── Kernel scheduling ────────────────────────────────────────────────
# Lower scheduler latency (desktop + gaming responsiveness)
kernel.sched_latency_ns = 4000000
kernel.sched_min_granularity_ns = 500000
kernel.sched_wakeup_granularity_ns = 500000
kernel.sched_migration_cost_ns = 1000000

# ─── Transparent Hugepages ────────────────────────────────────────────
# Always for games (better TLB performance)
kernel.transparent_hugepage = always

# ─── Kernel IPC ───────────────────────────────────────────────────────
# More shared memory for games (Wine/Proton)
kernel.shmmax = 26843545600
kernel.shmall = 4194304

# ─── Coredumps ────────────────────────────────────────────────────────
# Disable for gaming (avoid disk filling)
kernel.core_pattern = /dev/null
