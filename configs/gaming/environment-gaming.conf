# /etc/environment.d/solus-gaming.conf — Gaming environment variables
# Applied to all sessions for better gaming compatibility

# Steam
STEAM_GAMESCOPE_HDR=1
STEAM_GAMESCOPE_WAYLAND=1

# Proton
PROTON_ENABLE_HIDRAW=1
PROTON_ENABLE_NVAPI=1
PROTON_HIDE_NVIDIA_GPU=0
PROTON_USE_WINED3D=0

# DXVK
DXVK_HUD=0
DXVK_FILTER_DEVICE_NAME=""

# VKD3D
VKD3D_CONFIG=no_upload_hvv

# MangoHud (default off, enable per-game)
MANGOHUD=0

# Wine
WINEDEBUG=-all
WINEESYNC=1
WINEFSYNC=1

# Gamescope
GAMESCOPE_WAYLAND=1

# VULKAN — prefer RADV for AMD
RADV_PERFTEST=acot,nggc
AMD_VULKAN_ICD=RADV

# NVIDIA
__GL_SHADER_DISK_CACHE=1
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1

# SDL
SDL_VIDEODRIVER=wayland
SDL_AUDIODRIVER=pipewire

# QT
QT_QPA_PLATFORM=wayland
QT_WAYLAND_DISABLE_WINDOWDECORATION=1

# GDK/GTK
GDK_BACKEND=wayland
MOZ_ENABLE_WAYLAND=1

# Ozone (Chromium/Electron)
OZONE_PLATFORM_HINT=auto
