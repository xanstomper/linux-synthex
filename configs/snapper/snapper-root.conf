# /etc/snapper/configs/root — Synthex Snapper configuration for root filesystem
# Automatically takes snapshots of / (btrfs)

# Subvolume to snapshot
SUBVOLUME="/"

# Filesystem type
FSTYPE="btrfs"

# QGroup (leave empty for no quota)
QGROUP=""

# Snapshot location
SNAPPER_CONFIG="root"

# Limits for timeline snapshots
TIMELINE_CREATE="yes"
TIMELINE_CLEANUP="yes"

TIMELINE_LIMIT_HOUR="10"
TIMELINE_LIMIT_DAY="10"
TIMELINE_LIMIT_WEEK="0"
TIMELINE_LIMIT_MONTH="10"
TIMELINE_LIMIT_YEAR="10"

# Limits for number-based cleanup
NUMBER_LIMIT="50"
NUMBER_LIMIT_IMPORTANT="10"

# Limits for cleanup on free space
FREE_LIMIT="0.5"
FREE_LIMIT_CREATE="0.2"
MIN_AGE="1800"

# Limits for cleanup on btrfs quota
SPACE_LIMIT="0.5"
SPACE_LIMIT_CREATE="0.2"

# Allow user access
ALLOW_USERS=""
ALLOW_GROUPS="wheel"

# Sync before snapshot
SYNC_ACL="no"

# User/group to own snapshots
USER="root"
GROUP="root"
