[main]
gpgcheck=True
installonly_limit=3
clean_requirements_on_remove=True
best=False
skip_if_unavailable=True
max_parallel_downloads=10
fastestmirror=True

# Synthex performance defaults
deltarpm=False
metadata_expire=86400
timeout=30

# Keep kernels
installonlypkgs=kernel,kernel-core,kernel-modules,kernel-zen,kernel-zen-core,kernel-zen-modules,kernel-rt,kernel-rt-core,kernel-rt-modules

# Synthex repos
[synthex]
name=SynthOS $releasever - $basearch
baseurl=https://repo.synthex-os.org/$releasever/$basearch/
enabled=1
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-synthex

[synthex-updates]
name=SynthOS $releasever - $basearch - Updates
baseurl=https://repo.synthex-os.org/$releasever/$basearch/updates/
enabled=1
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-synthex

[synthex-testing]
name=SynthOS $releasever - $basearch - Testing
baseurl=https://repo.synthex-os.org/$releasever/$basearch/testing/
enabled=0
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-synthex
