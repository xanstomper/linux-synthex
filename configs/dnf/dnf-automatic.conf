# /etc/dnf/automatic.conf — Solus automatic update configuration

[commands]
# Check for updates daily
upgrade_type = default
random_sleep = 300
download_updates = yes
apply_updates = yes
# Reboot if needed
reboot = when-needed
reboot_command = "systemctl reboot"

[emitters]
# Send notifications
emit_via = motd
system_name = Solus Linux
output_width = 80

[email]
email_from = root@localhost
email_to = root
email_host = localhost

[base]
debuglevel = 1
