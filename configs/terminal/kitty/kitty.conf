# ╔══════════════════════════════════════════════════════════════╗
# ║  SynthOS Nova — kitty terminal configuration                  ║
# ║  /etc/xdg/kitty/kitty.conf · override: ~/.config/kitty/       ║
# ╚══════════════════════════════════════════════════════════════╝

# ─── Theme ─────────────────────────────────────────────────────────────
include nova.conf

# ─── Fonts ─────────────────────────────────────────────────────────────
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
modify_font cell_height 105%

# ─── Window ────────────────────────────────────────────────────────────
remember_window_size  no
initial_window_width  100c
initial_window_height 28c
window_padding_width  12
hide_window_decorations yes
confirm_os_window_close 0
placement_strategy center

# Slight translucency — pairs with compositor blur (Hyprland layerrule)
background_opacity 0.92
background_blur 16
dynamic_background_opacity yes

# ─── Cursor / selection ────────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.6
cursor_trail 3
selection_foreground #0C1116
selection_background #6C88A8

# ─── Scrolling ─────────────────────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 2.0

# ─── URLs / clipboard ──────────────────────────────────────────────────
url_style curly
open_url_with default
copy_on_select yes
strip_trailing_spaces smart
clipboard_control write-clipboard write-primary no-append

# ─── Tabs ──────────────────────────────────────────────────────────────
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1

# ─── Performance ───────────────────────────────────────────────────────
repaint_delay 8
input_delay 2
sync_to_monitor yes

# ─── Keybindings ───────────────────────────────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+tab    next_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+enter new_window
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+f    show_scrollback

# Launch fish with starship prompt (real packages)
shell fish
