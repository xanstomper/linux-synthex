# /etc/dracut.conf.d/synthex.conf — Synthex dracut configuration
# Generates a full initramfs with all needed modules

# Compress with zstd (fast + good ratio)
compress="zstd"
compress_options="-19"

# Add these modules
add_drivers+=" amdgpu radeon nouveau nvidia nvidia-drm nvidia-modeset "
add_drivers+=" nvme vmd xhci-pci ahci libahci "
add_drivers+=" btrfs ext4 xfs vfat exfat ntfs3 "
add_drivers+=" dm-crypt dm-verity luks "
add_drivers+=" i915 snd-hda-intel snd-sof "

# Include these dracut modules
add_dracutmodules+=" crypt btrfs lvm dm rootfs-block "
add_dracutmodules+=" network network-legacy kernel-network-modules "
add_dracutmodules+=" plymouth systemd systemd-initrd "
add_dracutmodules+=" i18n memstrack "

# Omit these (not needed, save space)
omit_dracutmodules+=" biosdevname "

# Hostonly mode (smaller initramfs, only what this machine needs)
hostonly="yes"
hostonly_cmdline="yes"

# Include firmware for common hardware
add_firmware+=" amd-ucode intel-ucode "

# Early microcode
early_microcode="yes"

# LUKS support
install_items+=" /etc/crypttab "

# Reduce initramfs size
reproducible="yes"
