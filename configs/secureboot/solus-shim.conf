# /etc/secure-boot/solus-shim.conf — Solus Secure Boot shim configuration
# This configures the shim bootloader for Secure Boot compatibility

# Shim entry name
SHIM_NAME="solus"

# MOK (Machine Owner Key) enrollment
MOK_PATH="/var/lib/shim-signed/mok"

# Trusted keys (will be enrolled in MOK list)
TRUSTED_KEYS=(
    "solus-signing-key"
    "nvidia-signing-key"
    "akmod-signing-key"
)

# Secure Boot policy
SB_POLICY="user-controlled"

# Allow user to enroll custom keys via mokutil
ALLOW_USER_ENROLLMENT=true
