# /etc/sddm.conf.d/solus.conf — Solus SDDM configuration

[Theme]
ThemeDir=/usr/share/sddm/themes
Current=solus-sddm-theme
CursorTheme=Bibata-Modern-Classic
CursorSize=24

[Autologin]
User=
Session=

[Users]
DefaultPath=/usr/local/bin:/usr/bin:/bin
HideShells=/sbin/nologin:/bin/false
HideUsers=
HideGroups=wheel,root
RememberLastSession=true
RememberLastUser=true

[General]
HaltCommand=/bin/systemctl poweroff
RebootCommand=/bin/systemctl reboot
Numlock=on
DisplayServer=wayland

[Wayland]
CompositorCommand=/usr/libexec/solus/start-solus-session.sh
SessionDir=/usr/share/wayland-sessions
EnableHiDPI=true

[X11]
ServerPath=/usr/bin/X
ServerArguments=-nolisten tcp
SessionDir=/usr/share/xsessions
EnableHiDPI=true
