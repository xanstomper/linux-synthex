# /etc/systemd/journald.conf.d/synthex.conf — Synthex journal configuration

[Journal]
# Persistent storage
Storage=persistent
# Compress old journals
Compress=yes
# Forward to syslog
ForwardToSyslog=yes
# Max journal size
SystemMaxUse=500M
SystemKeepFree=1G
# Max per-file
RuntimeMaxUse=100M
# Rate limit (prevent spam)
RateLimitIntervalSec=30s
RateLimitBurst=10000
# Max retention
MaxRetentionSec=2week
