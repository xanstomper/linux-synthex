# /etc/modprobe.d/solus-blacklist.conf — Blacklist problematic drivers

# Blacklist nouveau (use NVIDIA proprietary instead)
blacklist nouveau
blacklist nvidiafb
blacklist rivafb
blacklist rivatv

# Blacklist old radeon (use amdgpu instead)
blacklist radeon

# Blacklist btusb audio (causes issues with some headsets)
# blacklist snd_bt87x

# Blacklist Lenovo ideapad_laptop (causes wifi issues on some models)
# blacklist ideapad_laptop
