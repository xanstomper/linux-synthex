# /etc/modprobe.d/synthex-audio.conf — Audio module options

# SND_HDA — enable power save + better headset support
options snd_hda_intel power_save=0
options snd_hda_intel dsp_driver=1
options snd_hda_intel model=auto

# Realtek — better headphone detection
options snd_soc_rt5682s fvad_dmic_clk=3072000
options snd_soc_es8316 quirks=0x40

# PipeWire — reduce audio latency
options snd_pcm substr_time_period=1
