# /etc/modprobe.d/synthex-thinkpad.conf — ThinkPad specific options

# ThinkPad ACPI — enable hotkeys + fan control
options thinkpad_acpi fan_control=1
options thinkpad_acpi hotkey_report_mode=2

# Battery charge thresholds (extend battery life)
# options thinkpad_acpi battery_start_threshold=75
# options thinkpad_acpi battery_stop_threshold=80
