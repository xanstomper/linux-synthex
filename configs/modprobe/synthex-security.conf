# /etc/modprobe.d/synthex-security.conf — Security-critical module blacklist
# These modules are disabled by default to reduce attack surface.
# Re-enable only if explicitly needed for hardware compatibility.

# Disable Firewire/Thunderbolt DMA (cold boot attack vector)
blacklist firewire_ohci
blacklist firewire_core
blacklist firewire_sbp2
blacklist firewire_net
blacklist firewire_vendor_specific

# Disable legacy USB storage (can be used for data exfiltration)
# Uncomment if USB storage is needed:
# blacklist usb-storage

# Disable rare/unused network protocols
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc

# Disable uncommon filesystems (reduce kernel attack surface)
blacklist cramfs
blacklist freevxfs
blacklist udf
blacklist hfs
blacklist hfsplus
blacklist udf

# Disable debug-related modules
blacklist trace
blacklist tracing

# Disable packet capture (reduces network attack surface)
blacklist af_packet

# Disable uncommon wireless
blacklist mac80211_hwsim

# Disable virtualization modules (security-sensitive)
# Uncomment if not using KVM/QEMU:
# blacklist kvm
# blacklist kvm_intel
# blacklist kvm_amd

# Disable Bluetooth if not needed (attack vector)
# Uncomment to disable:
# blacklist bluetooth
# blacklist btusb
# blacklist btintel
# blacklist btrtl
# blacklist btbcm
