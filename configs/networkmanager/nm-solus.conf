# /etc/NetworkManager/conf.d/solus.conf — Solus NetworkManager defaults

[main]
# Use dnsmasq for DNS (faster, supports local cache)
dns=dnsmasq
# Don't modify resolv.conf manually
rc-manager=symlink
# Enable connectivity checking
connectivity-uri=https://getsol.us/connectivity-check
connectivity-interval=300

[connection]
# Auto-connect to wired/wifi by default
autoconnect=true
# IPv6 privacy extensions
ipv6.ip6-privacy=2
# Default DHCP timeout
ipv4.dhcp-timeout=60
ipv6.dhcp-timeout=60

[device]
# Don't manage devices that are already managed
ignore-carrier=false

[logging]
level=WARN
