# SynthOS — WireGuard client template
# Copy to /etc/wireguard/<ifname>.conf, fill in your values, then:
#   systemctl enable --now wg-quick@<ifname>
[Interface]
# Your client private key:  umask 077; wg genkey > privkey ; wg pubkey < privkey
PrivateKey = <CLIENT_PRIVATE_KEY>
# Unique tunnel IP assigned by your server operator
Address = 10.66.0.2/32,fd42:42:42::2/128
# Optional: route all traffic through the tunnel
# Table = off
# PostUp = ip rule add table 200; ip route add default via 10.66.0.1 table 200
# PostDown = ip rule del table 200; ip route del default via 10.66.0.1 table 200

[Peer]
# Your server's public key
PublicKey = <SERVER_PUBLIC_KEY>
# Preshared key (optional, recommended): wg genpsk
PresharedKey = <PRESHARED_KEY>
# Allow all destinations (0.0.0.0/0, ::/0) or just your LAN (e.g. 192.168.1.0/24)
AllowedIPs = 0.0.0.0/0, ::/0
# Server endpoint (public IP or hostname : port)
Endpoint = <SERVER_ENDPOINT>:51820
# Keep NAT mappings alive
PersistentKeepalive = 25
