# Synthex WireGuard VPN Client Configuration
# Install: cp wireguard-client.conf /etc/wireguard/wg0.conf
# Usage:   sudo wg-quick up wg0
#
# Replace the values below with your VPN server details.
# Generate keys with: wg genkey | tee privatekey | wg pubkey > publickey
#
# Reference: https://www.wireguard.com/quickstart/

[Interface]
# Client private key (generate with: wg genkey)
PrivateKey = CLIENT_PRIVATE_KEY_HERE
# Client VPN address (unique per client)
Address = 10.0.0.2/24
# DNS servers (Cloudflare + Quad9)
DNS = 1.1.1.1, 9.9.9.9
# Listen port (optional, auto-assigned if omitted)
# ListenPort = 51820

# Firewall rules: allow VPN traffic, kill switch for non-VPN traffic
# Uncomment for kill-switch (blocks internet if VPN is down):
# PostUp = iptables -I OUTPUT ! -o %i -m mark ! --mark $(wg show %i fwmark) -m addrtype ! --dst-type LOCAL -j REJECT
# PreDown = iptables -D OUTPUT ! -o %i -m mark ! --mark $(wg show %i fwmark) -m addrtype ! --dst-type LOCAL -j REJECT

[Peer]
# Server public key (get from server admin)
PublicKey = SERVER_PUBLIC_KEY_HERE
# Server endpoint
Endpoint = vpn.example.com:51820
# Allowed IPs — 0.0.0.0/0 routes all traffic through VPN
# Use 10.0.0.0/24 for split-tunnel (only VPN subnet)
AllowedIPs = 0.0.0.0/0, ::/0
# Keepalive to maintain connection through NAT
PersistentKeepalive = 25
