# /etc/synthex/privacy.conf — SynthOS global privacy policy
# SPDX-License-Identifier: GPL-3.0-or-later
#
# SynthOS collects NO telemetry, analytics, crash reports, or usage data.
# This file is the single source of truth for features that, by their nature,
# make outbound network requests. Every such feature is OPT-IN and OFF by
# default.  Setting any of these to "true" is an explicit user choice.
#
# --- Network-dependent features (all default OFF) ---------------------------
#
# Live weather lookups for the temporal/ambient theming daemon (synthex-temporal).
# When OFF, theming uses a purely local time-of-day + season heuristic and makes
# zero outbound requests.  When ON, weather is fetched from wttr.in.
weather_fetch = false

# Upstream change-monitoring engine (synthex-integration-engine).  A maintainer
# tool that polls GitHub / kernel.org / archlinux.org release APIs.  Not useful
# for end users; left OFF so no third-party API is contacted automatically.
integration_engine = false

# --- Telemetry / analytics (hard-OFF, not configurable) ---------------------
# There is no knob to enable telemetry because SynthOS ships none.
# The following are guaranteed at build time:
#   * No analytics SDK is bundled (no Sentry, Amplitude, Mixpanel, PostHog, Glean).
#   * KDE Plasma kded telemetry module is disabled (see desktop/plasma/).
#   * The AI agent telemetry setting defaults to False and is informational only.
telemetry = false

# --- Reporting --------------------------------------------------------------
# Nothing is uploaded.  Crash dumps (if any) stay local in $XDG_RUNTIME_DIR.
