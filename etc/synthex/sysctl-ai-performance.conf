# /etc/synthex/sysctl-ai-performance.conf
# SynthOS AI/IPC kernel tuning — loaded by synthex-ai-performance.service
# ─────────────────────────────────────────────────────────────────────────────

# ── Virtual memory ────────────────────────────────────────────────────────────
# Keep more anonymous pages in RAM; AI workloads are latency-sensitive.
vm.swappiness=1
# Aggressive writeback to avoid I/O stalls mid-inference.
vm.dirty_ratio=40
vm.dirty_background_ratio=10
# Allow large contiguous allocations for model weights.
vm.overcommit_memory=1

# ── IPC — fast inter-agent communication ─────────────────────────────────────
# Maximum single shared-memory segment: 64 GiB
kernel.shmmax=68719476736
# Total shared-memory pages: 16 TiB / PAGE_SIZE
kernel.shmall=4294967296
# Maximum single message in a System V message queue: 64 KiB
kernel.msgmax=65536
# Maximum total bytes in a System V message queue: 64 KiB
kernel.msgmnb=65536

# ── File watching — AI agents monitoring codebases ───────────────────────────
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=1024
fs.file-max=2097152

# ── CPU scheduler ────────────────────────────────────────────────────────────
# Reduce inter-CPU task migration to keep AI threads on warm caches.
kernel.sched_migration_cost_ns=5000000
# Let the kernel auto-group tasks by session for better throughput isolation.
kernel.sched_autogroup_enabled=1

# ── Security (keep the AI sandbox hardened) ──────────────────────────────────
kernel.dmesg_restrict=1
kernel.kptr_restrict=2
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.all.accept_redirects=0
net.ipv6.conf.all.accept_redirects=0
