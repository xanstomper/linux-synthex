[package]
name = "aether-sentinel"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Synthex Project <dev@getsynthex.org>"]
description = "AETHER SENTINEL — the zero-trust autonomous security intelligence layer for AETHER CORE"

[workspace]
members = ["."]

[[bin]]
name = "aether-sentinel"
path = "src/main.rs"

[lib]
name = "aether_sentinel"
path = "src/lib.rs"

[dependencies]
anyhow             = "1"
thiserror          = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono             = { version = "0.4", features = ["serde"] }
uuid               = { version = "1", features = ["v4"] }
rusqlite           = { version = "0.31", features = ["bundled"] }
clap               = { version = "4", features = ["derive"] }
regex              = "1"
sha2               = "0.10"
hex                = "0.4"
