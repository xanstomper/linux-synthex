# AETHER CORE — independent Cargo workspace root.
# Declared as its own [workspace] so it does not merge into the parent
# SynthOS workspace above it in the directory tree.
[workspace]
resolver = "2"
members = ["aetherd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["SynthOS Team <dev@getsynthex.org>"]

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
