# Solus Bluetooth Configuration
# Optimized for input devices (gamepads, keyboards, mice, headsets)

[General]
# Enable Bluetooth
Enable=true

# Discoverable timeout (seconds)
DiscoverableTimeout=0

# Always pairable
Pairable=true

# Privacy setting
Privacy=network

# Just Works pairing (no PIN for HID devices)
JustWorksRepairing=always

# Fast connectable
FastConnectable=true

# Enable experimental features (for LE Audio, etc.)
Experimental=true

# Enable kernel debug (for troubleshooting)
KernelDebug=false

[Policy]
# Auto-connect known devices
AutoEnable=true

# Reconnect on startup
ReconnectOnStartup=true

# Enable input device wake from sleep
WakeAllowed=true

[GATT]
# Enable caching for faster reconnection
CacheEnabled=true

# Key size for pairing
KeySize=16

[LE]
# Enable LE Audio (for Bluetooth 5.2+ headsets)
EnableLEAudio=true

# Scan interval (for gamepad latency)
ScanInterval=30
ScanWindow=30

[Adapter]
# Enable adapter
Enable=true

# Name visible to other devices
Name=Solus Linux

# Adapter mode (dual: BR/EDR + LE)
Mode=dual
