# Synthex low-latency audio configuration
# Installed to /etc/pipewire/client.conf.d/50-synthex-low-latency.conf
# Reduces PipeWire quantum for pro-audio / gaming / streaming.

context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100 48000 96000 ]
    default.clock.quantum = 256
    default.clock.min-quantum = 32
    default.clock.max-quantum = 2048
}

# rtkit grants PipeWire realtime priority so audio never glitches under load.
# realtime-setup (the systemd unit) configures realtime privileges for the
# audio group; users in the 'audio' group get SCHED_FIFO automatically.
