<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10151B"/>
      <stop offset="100%" stop-color="#0D1327"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C88A8"/>
      <stop offset="100%" stop-color="#56759B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Clock -->
  <text x="40" y="95" font-size="48" font-weight="300" fill="white" font-family="sans-serif" opacity="0.9">09:41</text>
  <text x="40" y="118" font-size="13" fill="#8899AA" font-family="sans-serif">Thursday, October 1</text>
  <!-- Card -->
  <rect x="290" y="60" width="220" height="380" rx="16" fill="#171D24" stroke="#2A2A4E" stroke-width="1"/>
  <rect x="360" y="60" width="80" height="2" rx="1" fill="#6C88A8" opacity="0.6"/>
  <!-- Logo -->
  <rect x="349" y="82" width="42" height="42" rx="10" fill="url(#btn)"/>
  <text x="370" y="111" font-size="24" text-anchor="middle" fill="#10151B">☀</text>
  <text x="400" y="145" font-size="20" font-weight="700" fill="white" text-anchor="middle" font-family="sans-serif">SynthOS</text>
  <text x="400" y="162" font-size="10" fill="#6C88A8" text-anchor="middle" font-family="sans-serif">Illuminate Your Desktop</text>
  <!-- User field -->
  <text x="310" y="200" font-size="10" fill="#8899AA" font-family="sans-serif">User</text>
  <rect x="308" y="207" width="184" height="36" rx="7" fill="#1E242F" stroke="#2A2A4E" stroke-width="1"/>
  <text x="322" y="230" font-size="13" fill="white" font-family="sans-serif">synthex</text>
  <!-- Password field -->
  <text x="310" y="260" font-size="10" fill="#8899AA" font-family="sans-serif">Password</text>
  <rect x="308" y="267" width="184" height="36" rx="7" fill="#1E242F" stroke="#6C88A8" stroke-width="1"/>
  <text x="322" y="290" font-size="14" fill="white" font-family="sans-serif">●●●●●●●●</text>
  <!-- Login button -->
  <rect x="308" y="318" width="184" height="38" rx="9" fill="url(#btn)"/>
  <text x="400" y="342" font-size="14" font-weight="700" fill="#10151B" text-anchor="middle" font-family="sans-serif">Sign In</text>
  <!-- Power buttons -->
  <rect x="328" y="374" width="34" height="34" rx="7" fill="#1E242F" stroke="#2A2A4E" stroke-width="1"/>
  <text x="345" y="396" font-size="14" text-anchor="middle" fill="white">⏻</text>
  <rect x="383" y="374" width="34" height="34" rx="7" fill="#1E242F" stroke="#2A2A4E" stroke-width="1"/>
  <text x="400" y="396" font-size="14" text-anchor="middle" fill="white">↺</text>
  <rect x="438" y="374" width="34" height="34" rx="7" fill="#1E242F" stroke="#2A2A4E" stroke-width="1"/>
  <text x="455" y="396" font-size="14" text-anchor="middle" fill="white">⏾</text>
  <!-- Version -->
  <text x="760" y="485" font-size="10" fill="#8899AA" text-anchor="end" font-family="sans-serif">SynthOS 2026.10</text>
</svg>
