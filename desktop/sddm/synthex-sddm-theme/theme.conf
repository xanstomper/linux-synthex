[General]
# SynthOS SDDM Theme — "Solaris"
# Glassmorphic login on an animated aurora-mesh gradient.

# Background is fully procedural (QML gradient + drifting amber blobs),
# so no image asset is required. Leave empty to use the live render.
background=

# Soft backdrop blur behind the glass card (requires a compositing greeter).
blur=true

# Typography
Font=Noto Sans
FontSize=12

# Render at native resolution; the QML scales the layout to the screen.
ScreenWidth=1920
ScreenHeight=1080

# Password masking
PasswordMask=•

# Session discovery
SessionDir=/usr/share/wayland-sessions:/usr/share/xsessions
