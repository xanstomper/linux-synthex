[General]
# SynthOS SDDM Theme Configuration

# Background — use bundled gradient (no image needed for dark theme)
background=
blur=false

# Font
Font=Noto Sans
FontSize=12

# Layout
ScreenWidth=1920
ScreenHeight=1080

# Password length hint (dots/chars)
PasswordMask=●

# Session
SessionDir=/usr/share/wayland-sessions:/usr/share/xsessions
