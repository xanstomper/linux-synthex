# Synthex Live ISO SDDM Configuration
# Auto-login for the live USB session (liveuser). NOT used on installed systems.
[Theme]
Current=synthex-sddm-theme
CursorTheme=Bibata-Modern-Classic
Font=Inter,10,-1,5,50,0,0,0,0,0
BackgroundBlur=true

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
Numlock=on
MouseSupport=true

[Users]
MaximumUid=65000
MinimumUid=1000

[Autologin]
User=liveuser
Session=plasma.desktop
Relogin=true

[X11]
ServerArgs=-nolisten tcp -keeptty

[Wayland]
EnableHiDPI=true
SessionDir=/usr/share/wayland-sessions
