# Solus SDDM Display Manager Configuration
# Provides themed login screen with session selection (Plasma/Hyprland/GNOME)
[Theme]
Current=solus-sddm-theme
CursorTheme=Bibata-Modern-Classic
Font=Inter,10,-1,5,50,0,0,0,0,0
BackgroundBlur=true

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
Numlock=on
MouseSupport=true

[Users]
MaximumUid=65000
MinimumUid=1000

[X11]
ServerArgs=-nolisten tcp -keeptty

[Wayland]
EnableHiDPI=true
SessionDir=/usr/share/wayland-sessions
