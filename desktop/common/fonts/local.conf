<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SynthOS Nova — system font defaults (Inter UI, JetBrains Mono terminal) -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Noto Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Noto Sans Mono</family></prefer>
  </alias>
  <match target="pattern">
    <test name="family"><string>Inter</string></test>
    <edit name="fontfeatures" mode="assign"><string>ss01 on</string></edit>
  </match>
</fontconfig>
