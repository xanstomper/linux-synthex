# ╔══════════════════════════════════════════════════════════════╗
# ║  Synthex Hyprlock — Hardware Security Lock Screen            ║
# ║  Matches Synthex Libadwaita / Cyberpunk Glass Aesthetic      ║
# ╚══════════════════════════════════════════════════════════════╝

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
    color = rgba(16, 18, 24, 0.95)
}

# ─── Clock Display ────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(240, 244, 250, 0.95)
    font_size = 72
    font_family = Inter Bold, JetBrains Mono
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d, %Y")"
    color = rgba(154, 161, 171, 0.85)
    font_size = 18
    font_family = Inter Medium, sans-serif
    position = 0, 80
    halign = center
    valign = center
}

# ─── Aegis Defense Status Badge ──────────────────────────────────────────
label {
    monitor =
    text = 🛡️ Aegis Endpoint Defense: Active & Armed
    color = rgba(122, 162, 247, 0.90)
    font_size = 13
    font_family = Inter SemiBold, sans-serif
    position = 0, 30
    halign = center
    valign = center
}

# ─── Password Input Field ────────────────────────────────────────────────
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 1
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(122, 162, 247, 0.45)
    inner_color = rgba(25, 29, 40, 0.85)
    font_color = rgb(240, 244, 250)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##7a818c">Enter Password…</span>
    hide_input = false
    rounding = 12
    check_color = rgb(115, 218, 202)
    fail_color = rgb(247, 118, 142)
    fail_text = <i>Authentication Failed ($ATTEMPTS)</i>
    fail_transition = 200
    capslock_color = rgb(224, 175, 104)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ─── User Profile ────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$USER"
    color = rgba(221, 227, 235, 0.80)
    font_size = 14
    font_family = Inter SemiBold, sans-serif
    position = 0, -125
    halign = center
    valign = center
}
