# ╔══════════════════════════════════════════════════════════════╗
# ║  Synthex Hyprland — Default Configuration                     ║
# ║  Design: "Synthex Dynamic Tiling"                             ║
# ║  Version: 1.0.0                                             ║
# ╚══════════════════════════════════════════════════════════════╝
# Installed to: /etc/hypr/hyprland.conf
# User override: ~/.config/hypr/hyprland.conf

# ─── Monitor ──────────────────────────────────────────────────────────────
monitor=,preferred,auto,1

# Auto-detect and configure monitors
exec-once=hyprctl monitors all

# ─── Environment ──────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Synthex-Cursor
env = GTK_THEME,Adwaita:dark
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = _JAVA_AWT_WM_NONREPARENTING,1
env = EDITOR,helix
env = TERMINAL,kitty
env = BROWSER,firefox

# ─── Input ────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 1
    mouse_refocus = false

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click = true
        drag_lock = true
        scroll_factor = 0.5
    }

    sensitivity = 0
    accel_profile = flat
}

# ─── General ──────────────────────────────────────────────────────────────
general {
    layout = dwindle

    # Gaps
    gaps_in = 8
    gaps_out = 10
    gaps_workspaces = 20

    # Border — periwinkle → lavender gradient (Nova design tokens)
    border_size = 2
    col.active_border = rgb(6C88A8) rgb(ABA2E4) 45deg
    col.inactive_border = rgba(67707D66)

    # Corner radius
    no_border_on_floating = false
    resize_on_border = true
    cursor_inactive_timeout = 3

    # Allow tearing
    allow_tearing = true
}

# ─── Decoration ───────────────────────────────────────────────────────────
decoration {
    # Rounded corners
    rounding = 12

    # Drop shadows
    drop_shadow = true
    shadow_range = 10
    shadow_render_power = 3
    shadow_ignore_window = true
    col.shadow = rgba(00000055)

    # Blur
    blur {
        enabled = true
        size = 6
        passes = 3
        ignore_opacity = false
        new_optimizations = on
        noise = 0.01
        contrast = 0.9
        brightness = 1.0
        vibrancy = 0.2
        popups = true
        popups_ignorealpha = 0.2
    }

    # Dim when not focused
    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0
}

# ─── Animations ──────────────────────────────────────────────────────────
animations {
    enabled = yes

    bezier = synthexEase, 0.05, 0.7, 0.1, 1.0
    bezier = synthexEnter, 0.05, 0.7, 0.1, 1.0
    bezier = synthexExit, 0.3, 0.0, 0.8, 0.15
    bezier = synthexMove, 0.4, 0.0, 0.2, 1.0

    animation = windows, 1, 5, synthexEnter, popin 80%
    animation = windowsOut, 1, 4, synthexExit, popin 80%
    animation = border, 1, 8, default
    animation = borderangle, 1, 30, default, once
    animation = fade, 1, 6, default
    animation = fadeShadow, 1, 6, default
    animation = workspaces, 1, 6, synthexEase, slidevert
    animation = specialWorkspace, 1, 6, synthexEase, slidevert

    # Reduce motion mode (toggle with Super+Shift+V)
    # Set all durations to 0 for no animations
}

# ─── Layouts ──────────────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
    default_split_ratio = 0.70
    smart_split = true
    smart_resizing = true
    no_gaps_when_only = false
    use_active_for_splits = true
}

master {
    special_scale_factor = 0.8
    mfact = 0.70
    orientation = center
    smart_status = true
    always_center_master = true
    drop_at = center
    allow_small_split = true
}

# ─── Gestures ─────────────────────────────────────────────────────────────
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_forever = true
    workspace_swipe_cancel_ratio = 0.30
    workspace_swipe_create_new = true
}

# ─── Misc ─────────────────────────────────────────────────────────────────
misc {
    disable_autoreload = false
    disable_hyprland_logo = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
    vfr = true
    vrr = 2  # Full adaptive sync
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    always_follow_on_dnd = true
    layers_hog_keyboard_focus = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_tearing_damage_optimization = true
    middle_click_paste = true
    render_unfocused_fps = 30
    focus_on_activate = true
    no_direct_scanout = false
    render_ahead_of_time = true
    render_ahead_safezone = 1
}

# ─── Window Rules ─────────────────────────────────────────────────────────

# Firefox — Force Wayland
windowrule = opacity 1.0 1.0, title:^(Mozilla Firefox)$
windowrule = nomaximizerequest, class:^(firefox)$

# Float certain dialogs
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)
windowrulev2 = float, class:^(pavucontrol)
windowrulev2 = float, class:^(blueman-manager)
windowrulev2 = float, class:^(nm-connection-editor)
windowrulev2 = float, class:^(org.gnome.Calculator)
windowrulev2 = float, class:^(org.gnome.Loupe)
windowrulev2 = float, title:^(Picture in picture)
windowrulev2 = float, title:^(Volume Control)
windowrulev2 = float, title:^(Authentication Required)
windowrulev2 = float, title:^(File Operation Progress)
windowrulev2 = float, title:^(Confirm)

# Pin certain windows (keep above)
windowrulev2 = pin, class:^(pavucontrol)
windowrulev2 = pin, class:^(blueman-manager)

# Fullscreen for games and video
windowrulev2 = fullscreen, class:^(gamescope)
windowrulev2 = fullscreen, class:^(steam_app_*)
windowrulev2 = fullscreen, class:^(mpv)

# No decorations for maximized windows
windowrulev2 = noborder, fullscreen:1
windowrulev2 = noborder, fullscreen:2

# Discord — Float when not focused on content
windowrulev2 = float, class:^(discord)$, title:^(.*Discord.*Call.*)$
windowrulev2 = pin, class:^(discord)$, title:^(.*Call.*)$

# Keep certain windows on specific workspaces
windowrulev2 = workspace 2, class:^(discord)
windowrulev2 = workspace 2, class:^(thunderbird)
windowrulev2 = workspace 4, class:^(spotify)
windowrulev2 = workspace 4, class:^(firefox)$, title:^(.*YouTube Music.*)$
windowrulev2 = workspace 5, class:^(code-oss)
windowrulev2 = workspace 5, class:^(jetbrains-*)

# Ignore maximize requests from some apps
windowrulev2 = nomaximizerequest, class:^(firefox)

# Size rules
windowrulev2 = minsize 640 400, class:^(kitty)
windowrulev2 = minsize 800 600, class:^(firefox)
windowrulev2 = maxsize 1920 1080, class:^(mpv)

# Suppress warnings from certain apps
windowrulev2 = suppressevent maximize, class:^()

# ─── Layer rules (blur behind shell surfaces; dock on top) ─────────────
layerrule = blur, waybar
layerrule = blur, wofi
layerrule = blur, notifications
layerrule = ignorezero, wofi

# ─── Exec Rules (Auto-start) ──────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = wl-paste --watch cliphist store  # Clipboard manager
exec-once = mako  # Notification daemon
exec-once = swayidle -w \
    timeout 300 'hyprctl dispatch dpms off' \
    timeout 600 'loginctl lock-session' \
    resume 'hyprctl dispatch dpms on'
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/libexec/xdg-desktop-portal-hyprland
exec-once = hyprctl setcursor Synthex-Cursor 24
exec-once = hyprpaper
# Night light (real gamma control via wlsunset; toggle with Super+Y)
exec-once = wlsunset -t 4200 -T 6500

# ─── Binds ────────────────────────────────────────────────────────────────

# Main modifier
$mainMod = SUPER

# Terminal
bind = $mainMod, Return, exec, kitty

# Application launcher
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, space, exec, wofi --show drun
bind = $mainMod, R, exec, wofi --show drun   # alias ("run")

# Close window
bind = $mainMod, Q, killactive,

# Fullscreen
bind = $mainMod, F, fullscreen, 1
bind = $mainMod CTRL, F, fullscreen, 0  # Fullscreen (no border)

# Toggle floating
bind = $mainMod, grave, togglefloating,

# Toggle pin
bind = $mainMod SHIFT, grave, pin,

# Focus
bind = $mainMod, J, focuscurrentorlast,
bind = $mainMod, K, changegroupactive, f
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces (1–9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Cycle workspaces
bind = $mainMod, Tab, workspace, +1
bind = $mainMod SHIFT, Tab, workspace, -1

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic

# Layout controls
bind = $mainMod CTRL, M, exec, hyprctl keyword layout master
bind = $mainMod CTRL, D, exec, hyprctl keyword layout dwindle

# Master layout controls
bind = $mainMod CTRL, H, layoutmsg, mfact -0.05
bind = $mainMod CTRL, L, layoutmsg, mfact +0.05
bind = $mainMod CTRL, K, layoutmsg, cycle
bind = $mainMod CTRL, J, layoutmsg, swapwithmaster master

# Dwindle layout controls
bind = $mainMod CTRL, left, layoutmsg, split:l
bind = $mainMod CTRL, right, layoutmsg, split:r
bind = $mainMod CTRL, up, layoutmsg, split:u
bind = $mainMod CTRL, down, layoutmsg, split:d

# Gaps control
bind = $mainMod, equal, exec, hyprctl keyword general:gaps_in 16 && hyprctl keyword general:gaps_out 20
bind = $mainMod, minus, exec, hyprctl keyword general:gaps_in 8 && hyprctl keyword general:gaps_out 10
bind = $mainMod, 0, exec, hyprctl keyword general:gaps_in 0 && hyprctl keyword general:gaps_out 0

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86AudioPlay, exec, playerctl play-pause
bindel = , XF86AudioPause, exec, playerctl pause
bindel = , XF86AudioNext, exec, playerctl next
bindel = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, Print, exec, grim - | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, Print, exec, grim - | wl-copy && notify-send "Screenshot" "Screenshot saved to clipboard"

# Lock screen
bind = $mainMod, Escape, exec, loginctl lock-session

# Night light toggle (wlsunset — real gamma control)
bind = $mainMod, Y, exec, pkill -USR1 wlsunset || wlsunset -t 4200 -T 6500

# Notifications
bind = $mainMod, N, exec, makoctl dismiss
bind = $mainMod SHIFT, N, exec, makoctl restore

# Clipboard
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Power menu
bind = $mainMod SHIFT, E, exec, wofi --show powermenu

# Toggle animations (reduce motion)
bind = $mainMod SHIFT, V, exec, \
    if hyprctl getoption animations:enabled | grep -q "yes"; then \
        hyprctl keyword animations:enabled no; \
    else \
        hyprctl keyword animations:enabled yes; \
    fi

# Reload config
bind = $mainMod SHIFT, C, exec, hyprctl reload

# ─── Unbinds (prevent accidental triggers) ────────────────────────────────
bind = $mainMod, F11, submap, reset  # Unbind to prevent conflict

# ─── Submaps (Vim mode in windows) ────────────────────────────────────────
submap = reset

# ─── Window Grouping ──────────────────────────────────────────────────────
    group {
    groupbar {
        enabled = true
        height = 20
        font_size = 11
        gradients = true
        col.active = rgba(6C88A8FF)
        col.inactive = rgba(67707D66)
        col.locked = rgba(D97C82FF)
        text_color = rgba(DDE3EBFF)
    }
    member_overview = true
    insert_after_current = true
    focus_removed_window = true
    col.border_active = rgba(6C88A8FF)
    col.border_inactive = rgba(67707D66)
    col.border_locked = rgba(D97C82FF)
}

# Group controls
bind = $mainMod, G, togglegroup,
bind = $mainMod SHIFT, G, changegroupactive,
bind = $mainMod ALT, Tab, changegroupactive, f
bind = $mainMod ALT SHIFT, Tab, changegroupactive, b
bind = $mainMod ALT, left, movewindoworgroup, l
bind = $mainMod ALT, right, movewindoworgroup, r
bind = $mainMod ALT, up, movewindoworgroup, u
bind = $mainMod ALT, down, movewindoworgroup, d
