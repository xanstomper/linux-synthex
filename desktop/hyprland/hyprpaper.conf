# ╔══════════════════════════════════════════════════════════════╗
# ║  Synthex Hyprland — Wallpaper Configuration (hyprpaper)       ║
# ║  Version: 1.0.0                                             ║
# ╚══════════════════════════════════════════════════════════════╝
# Installed to: /etc/hypr/hyprpaper.conf
# User override: ~/.config/hypr/hyprpaper.conf

# ─── Preload ──────────────────────────────────────────────────────────────
# Preload wallpapers for instant switching
preload = /usr/share/wallpapers/synthex-nova.png
preload = /usr/share/wallpapers/synthex-midnight.png
preload = /usr/share/wallpapers/synthex-latte.png
preload = /usr/share/wallpapers/synthex-graphite.png

# ─── Wallpapers ───────────────────────────────────────────────────────────
# Assign wallpapers to monitors by name or use fallback
wallpaper = ,/usr/share/wallpapers/synthex-nova.png

# ─── Dual Monitor Setup ──────────────────────────────────────────────────
# Uncomment and customize for multi-monitor:
# wallpaper = eDP-1,/usr/share/wallpapers/synthex-nova.png
# wallpaper = HDMI-A-1,/usr/share/wallpapers/synthex-nova.png

# ─── Splash / Overlay ────────────────────────────────────────────────────
# Temporary overlay (uncomment to enable)
# splash = true

# ─── IPC ──────────────────────────────────────────────────────────────────
# Enable IPC for dynamic wallpaper switching via wallply or pywal
ipc = on

# ─── Misc ────────────────────────────────────────────────────────────────
# Unload after preload to save VRAM (set false if you want instant switching)
unload_unused = true
