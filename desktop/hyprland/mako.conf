# ╔══════════════════════════════════════════════════════════════╗
# ║  SynthOS Nova — mako notification daemon configuration       ║
# ║  Installed to: /etc/xdg/mako/config (override ~/.config/mako) ║
# ╚══════════════════════════════════════════════════════════════╝

# ─── Placement & geometry ─────────────────────────────────────────────
# Top-right, under the floating waybar panel
anchor=top-right
margin=12,58
width=380
height=160
padding=14,16
border-size=1
border-radius=16
max-visible=4
layer=overlay
icons=1
max-icon-size=48

# ─── Typography ───────────────────────────────────────────────────────
font=Inter 11
markup=1
format=<b>%s</b>\n%b
text-alignment=left

# ─── Nova palette ─────────────────────────────────────────────────────
background-color=#1E242FF2
text-color=#DDE3EB
border-color=#6C88A880
progress-color=over #6C88A840

# ─── Behaviour ────────────────────────────────────────────────────────
default-timeout=6000
ignore-timeout=0
hide-on-clear=0
history=1

[urgency=low]
background-color=#1E242FE6
text-color=#9AA1AB
border-color=#FFFFFF14
default-timeout=4000

[urgency=critical]
background-color=#D97C82F2
text-color=#10151B
border-color=#D97C82
default-timeout=0

[app-name=spotify]
anchor=bottom-right
margin=12,12
group-by=app-name

[category=mpd]
anchor=bottom-right
