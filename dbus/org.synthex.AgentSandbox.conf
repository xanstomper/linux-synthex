<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  D-Bus system policy for org.synthex.AgentSandbox (synthex-agent-sandbox daemon).
  Installed to: /usr/share/dbus-1/system.d/org.synthex.AgentSandbox.conf

  The sandbox broker is the gatekeeper for all agent capability requests.
  Only root and synthex-brain may spawn new sandboxes; console users may
  only inspect their own sandbox or approve/deny a pending capability request.
-->

<busconfig>

  <!-- Sandbox broker owns the name and can do everything -->
  <policy user="synthex-brain">
    <allow own="org.synthex.AgentSandbox"/>
    <allow send_destination="org.synthex.AgentSandbox"/>
    <allow receive_sender="org.synthex.AgentSandbox"/>
  </policy>

  <policy user="root">
    <allow own="org.synthex.AgentSandbox"/>
    <allow send_destination="org.synthex.AgentSandbox"/>
    <allow receive_sender="org.synthex.AgentSandbox"/>
  </policy>

  <!-- Console users: approve/deny prompts and query their sandbox list only -->
  <policy at_console="true">
    <allow send_destination="org.synthex.AgentSandbox"
           send_interface="org.synthex.AgentSandbox"
           send_member="ApproveCapability"/>
    <allow send_destination="org.synthex.AgentSandbox"
           send_interface="org.synthex.AgentSandbox"
           send_member="DenyCapability"/>
    <allow send_destination="org.synthex.AgentSandbox"
           send_interface="org.synthex.AgentSandbox"
           send_member="ListSandboxes"/>
    <allow send_destination="org.synthex.AgentSandbox"
           send_interface="org.synthex.AgentSandbox"
           send_member="GetSandboxInfo"/>
    <allow receive_sender="org.synthex.AgentSandbox"/>
  </policy>

  <policy group="synthex-brain">
    <allow send_destination="org.synthex.AgentSandbox"/>
    <allow receive_sender="org.synthex.AgentSandbox"/>
  </policy>

  <!-- Everything else denied — sandboxed agents cannot re-claim the broker name -->
  <policy context="default">
    <deny own="org.synthex.AgentSandbox"/>
    <deny send_destination="org.synthex.AgentSandbox"/>
  </policy>

</busconfig>
