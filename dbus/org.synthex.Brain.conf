<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  D-Bus system policy for org.synthex.Brain (synthex-brain daemon).
  Installed to: /usr/share/dbus-1/system.d/org.synthex.Brain.conf
-->

<busconfig>

  <!-- The daemon runs as synthex-brain system user and owns this name. -->
  <policy user="synthex-brain">
    <allow own="org.synthex.Brain"/>
  </policy>

  <!-- Root may also claim the name (dev/debug only). -->
  <policy user="root">
    <allow own="org.synthex.Brain"/>
    <allow send_destination="org.synthex.Brain"/>
    <allow receive_sender="org.synthex.Brain"/>
  </policy>

  <!-- Any logged-in user may call into the Brain (sandbox broker filters further). -->
  <policy at_console="true">
    <allow send_destination="org.synthex.Brain"
           send_interface="org.synthex.Brain"/>
    <allow receive_sender="org.synthex.Brain"/>
  </policy>

  <!-- Other system services (hermes, workspace-ai, etc.) -->
  <policy group="synthex-brain">
    <allow send_destination="org.synthex.Brain"/>
    <allow receive_sender="org.synthex.Brain"/>
  </policy>

  <!-- Default: deny everything not explicitly allowed. -->
  <policy context="default">
    <deny send_destination="org.synthex.Brain"/>
  </policy>

</busconfig>
