<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  D-Bus system policy for org.synthex.Hermes (synthex-hermes daemon).
  Installed to: /usr/share/dbus-1/system.d/org.synthex.Hermes.conf
-->

<busconfig>

  <policy user="synthex-brain">
    <allow own="org.synthex.Hermes"/>
    <allow send_destination="org.synthex.Hermes"/>
    <allow receive_sender="org.synthex.Hermes"/>
  </policy>

  <policy user="root">
    <allow own="org.synthex.Hermes"/>
    <allow send_destination="org.synthex.Hermes"/>
    <allow receive_sender="org.synthex.Hermes"/>
  </policy>

  <!-- Agents running as console users can submit prompts to Hermes -->
  <policy at_console="true">
    <allow send_destination="org.synthex.Hermes"
           send_interface="org.synthex.Hermes"
           send_member="Ask"/>
    <allow send_destination="org.synthex.Hermes"
           send_interface="org.synthex.Hermes"
           send_member="AskStream"/>
    <allow send_destination="org.synthex.Hermes"
           send_interface="org.synthex.Hermes"
           send_member="GetSessions"/>
    <allow receive_sender="org.synthex.Hermes"/>
  </policy>

  <policy group="synthex-brain">
    <allow send_destination="org.synthex.Hermes"/>
    <allow receive_sender="org.synthex.Hermes"/>
  </policy>

  <policy context="default">
    <deny send_destination="org.synthex.Hermes"/>
  </policy>

</busconfig>
