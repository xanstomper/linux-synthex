<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  D-Bus system policy for org.synthex.WorkspaceAI (synthex-workspace-ai daemon).
  Installed to: /usr/share/dbus-1/system.d/org.synthex.WorkspaceAI.conf
-->

<busconfig>

  <policy user="synthex-brain">
    <allow own="org.synthex.WorkspaceAI"/>
    <allow send_destination="org.synthex.WorkspaceAI"/>
    <allow receive_sender="org.synthex.WorkspaceAI"/>
  </policy>

  <policy user="root">
    <allow own="org.synthex.WorkspaceAI"/>
    <allow send_destination="org.synthex.WorkspaceAI"/>
    <allow receive_sender="org.synthex.WorkspaceAI"/>
  </policy>

  <!-- Console users can query workspace state and assign agents -->
  <policy at_console="true">
    <allow send_destination="org.synthex.WorkspaceAI"
           send_interface="org.synthex.WorkspaceAI"
           send_member="GetWorkspaceContext"/>
    <allow send_destination="org.synthex.WorkspaceAI"
           send_interface="org.synthex.WorkspaceAI"
           send_member="ListAgents"/>
    <allow send_destination="org.synthex.WorkspaceAI"
           send_interface="org.synthex.WorkspaceAI"
           send_member="AssignAgent"/>
    <allow send_destination="org.synthex.WorkspaceAI"
           send_interface="org.synthex.WorkspaceAI"
           send_member="SwitchWorkspace"/>
    <allow receive_sender="org.synthex.WorkspaceAI"/>
  </policy>

  <policy group="synthex-brain">
    <allow send_destination="org.synthex.WorkspaceAI"/>
    <allow receive_sender="org.synthex.WorkspaceAI"/>
  </policy>

  <policy context="default">
    <deny send_destination="org.synthex.WorkspaceAI"/>
  </policy>

</busconfig>
