# SynthOS Calamares Installer — Master Settings
# Calamares 3.3+ YAML format

modules-search:
  - /usr/lib/calamares/modules
  - /usr/share/calamares/modules

instances: []

sequence:
  # ── SHOW PHASE (wizard pages the user sees) ──────────────────
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - synthexprofile
    - summary

  # ── EXEC PHASE (installation runs) ──────────────────────────
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - users
    - networkcfg
    - hwclock
    - services-systemd
    - dracut
    - packages
    - synthexhardwaredetect
    - grubcfg
    - bootloader
    - displaymanager
    - synthexfirstuser
    - synthexnetworksetup
    - synthexgpusetup
    - synthexfde
    - synthexsecuritysetup
    - synthexservices
    - synthextheme
    - synthexpostinstall

    - removeuser
    - umount
    - finished

branding: synthex
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-install: false
quit-at-end: true
log-level: 6
