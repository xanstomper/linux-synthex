// Synthex Calamares Installer — Complete Configuration
// This is the master settings.conf for the Calamares installer

{
    "modules-search": [
        "/usr/lib/calamares/modules",
        "/usr/share/calamares/modules"
    ],
    
    "sequence": [
        {
            "show": [
                "welcome",
                "locale",
                "keyboard",
                "partition",
                "users",
                "synthexprofile",
                "summary"
            ]
        },
        {
            "exec": [
                "partition",
                "mount",
                "unpackfs",
                "packages",
                "networkcfg",
                "hwclock",
                "users",
                "displaymanager",
                "machineid",
                "fstab",
                "removeuser",
                "bootloader",
                "grubcfg",
                "services-systemd",
                "synthexpostinstall",
                "umount",
                "finished"
            ]
        }
    ],
    
    "branding": "synthex",
    "prompt-install": true,
    "dont-chroot": false,
    "oem-setup": false,
    "disable-cancel-during-install": false,
    "quit-at-end": true,
    "log-level": 6,
    "log-file": "/var/log/calamares.log"
}
