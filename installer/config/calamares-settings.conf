# Solus Linux - Calamares Installer Configuration
# This is the main settings file for the Calamares system installer
# Used during ISO boot to install Solus to target system
#
# File format: YAML
# See: https://github.com/calamares/calamares/wiki

# =============================================================================
# Global Settings
# =============================================================================

---
branding: solus
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
cancel-warning: true
disable-cancel-during-exec: true
quit-at-end: false
quit-at-end-confirmed: true
show-license: false
show-info: false
show-execution: true
show-explicit-info: false
show-extended: false
show-success: true
show-unpack: false
show-warning: true
show-danger: false
enter-chroot: false
debug: false
debug-output: false
disable-networking-check: false
use-sudo: true
root-mount-point: "/mnt"

# =============================================================================
# Module Sequence
# =============================================================================
# The order defines the installation flow

sequence:
- show:
    - welcome
    - unpack
    - summary
- exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - dracut
    - bootloader
    - grubcfg
    - networkcfg
    - services-systemd
    - users
    - displaymanager
    - removeuser
    - solusprofile
    - shellprocess
    - finished

# =============================================================================
# Branding
# =============================================================================

branding:
    name: "Solus Linux"
    version: "1.0"
    short-name: "Solus"
    short-version: "1.0"
    versioned-name: "Solus Linux 1.0"
    bootloader-entry-name: "Solus Linux"
    author: "Solus Project"
    author-mail: "support@getsol.us"
    author-url: "https://getsol.us"
    support-url: "https://discuss.getsol.us"
    bug-report-url: "https://dev.getsol.us"
    homepage-url: "https://getsol.us"
    donate-url: "https://getsol.us/donate"
    logo: "solus-logo.png"
    welcome-image: "solus-welcome.png"
    welcome-text: >-
        Welcome to the Solus Linux installer.<br/>
        You are about to install Solus onto your computer.<br/><br/>
        Please ensure you have:<br/>
        • A stable internet connection<br/>
        • At least 25 GB of free disk space<br/>
        • 4 GB or more of RAM recommended<br/><br/>
        <i>This installer will guide you through the setup process.</i>
    loaded-text: >-
        The installer has been loaded successfully.<br/>
        Ready to begin installation.
    warning-text: >-
        <b>Warning:</b> Installing Solus will modify your disk.<br/>
        Make sure to back up your data before proceeding.
    welcome-style: "sidebar"
    product-icon: "start-here-solus"
    product-name: "Solus Linux"
    product-version: "1.0"
    short-product-name: "Solus"
    images: "images/"
    slideshow: "show.qml"
    style:
        sidebar:
            background: "#1a1a2e"
            text-color: "#ffffff"
            selected-text-color: "#33ccff"
            highlight-color: "#33ccff"
        main:
            background: "#f5f5f5"
            text-color: "#333333"
            link-color: "#33ccff"

# =============================================================================
# Welcome Module
# =============================================================================

welcome:
    requirements:
        required:
            - storage
            - ram
            - root
            - screen
        required-disk-space: 25000
        required-ram: 2048
        check:
            storage:
                file-system: true
            ram:
                size: 2.0
            power:
                battery: false
                ac: true
            internet:
                ping: true
                dns: true
                ntp: true
            root:
                is-user-root: false
            screen:
                min-resolution:
                    width: 1024
                    height: 768
        storage:
            model: "Solus Linux requires at least 25 GB of free space."
            required: true
        ram:
            model: "Solus Linux recommends at least 4 GB of RAM (2 GB minimum)."
            required: true
        power:
            battery: false
            ac: true
        internet:
            required: false
            model: "Network connectivity is recommended but not required."
        root:
            required: true
    language-sections:
        - locale
        - keyboard
    support-url: "https://discuss.getsol.us"
    known-issues-url: "https://dev.getsol.us"

# =============================================================================
# Locale / Language Configuration
# =============================================================================

locale:
    # Available locales
    locales:
        - en_US.UTF-8
        - en_GB.UTF-8
        - de_DE.UTF-8
        - fr_FR.UTF-8
        - es_ES.UTF-8
        - it_IT.UTF-8
        - pt_BR.UTF-8
        - ru_RU.UTF-8
        - ja_JP.UTF-8
        - zh_CN.UTF-8
        - zh_TW.UTF-8
        - ko_KR.UTF-8
    # Default locale
    default: en_US.UTF-8
    # Generate locales
    generate: true
    # Locale format
    format:
        - LC_CTYPE
        - LC_NUMERIC
        - LC_TIME
        - LC_COLLATE
        - LC_MONETARY
        - LC_MESSAGES
        - LC_PAPER
        - LC_NAME
        - LC_ADDRESS
        - LC_TELEPHONE
        - LC_MEASUREMENT
        - LC_IDENTIFICATION

# =============================================================================
# Keyboard Configuration
# =============================================================================

keyboard:
    # XKB layout models
    models:
        - pc105
        - pc104
        - macintosh
        - thinkpad
    defaultModel: "pc105"
    # Available layouts
    layouts:
        - us
        - us(alt-intl)
        - us(dvorak)
        - us(colemak)
        - us(workman)
        - gb
        - de
        - fr
        - es
        - it
        - pt
        - ru
        - jp
        - cn
    defaultLayout: "us"
    # Available variants
    variants:
        - ""
        - alt-intl
        - altgr-intl
        - colemak
        - dvorak
        - workman
        - neo
    defaultVariant: ""
    # Toggle keyboards combination
    switchOption: "grp:alt_shift_toggle"

# =============================================================================
# Partitioning Module - Advanced BTRFS Configuration
# =============================================================================

partition:
    # Partitioning modes
    defaultPartitioning: "alongside"
    availablePartitioning:
        - erase
        - replace
        - alongside
        - manual
    efi: true
    requireLabel: true
    # Filesystem options
    filesystems:
        - btrfs
        - ext4
        - xfs
    defaultFilesystem: "btrfs"
    # Backend
    backend: "parted"
    # Drive selection
    allowIncomplete: false
    alwaysShowPartitionLabels: true
    grubInstall: true
    # BTRFS configuration
    btrfs:
        compression: "zstd"
        compressionLevel: 3
        subvolumes:
            - mountPoint: /
              subvolume: "@"
            - mountPoint: /home
              subvolume: "@home"
            - mountPoint: /var
              subvolume: "@var"
            - mountPoint: /tmp
              subvolume: "@tmp"
            - mountPoint: /opt
              subvolume: "@opt"
            - mountPoint: /srv
              subvolume: "@srv"
            - mountPoint: /root
              subvolume: "@root"
            - mountPoint: /.snapshots
              subvolume: "@snapshots"
        # Default subvolume layout
        defaultSubvolumes:
            - "@"
            - "@home"
            - "@var"
            - "@tmp"
            - "@snapshots"
        # Snapper integration
        snapper:
            enabled: true
            configs:
                - subvolume: "@"
                  snapshotLimit: 50
                  timelineLimitDaily: 10
                  timelineLimitWeekly: 10
                  timelineLimitMonthly: 0
                  timelineLimitYearly: 0
                - subvolume: "@home"
                  snapshotLimit: 25
                  timelineLimitDaily: 5
                  timelineLimitWeekly: 5
                  timelineLimitMonthly: 0
                  timelineLimitYearly: 0
    # LUKS encryption
    luks:
        enabled: true
        options:
            - swap
            - home
            - root
        encryption: "luks2"
        keySize: 512
        hash: "sha512"
        iterTime: 5000
        cipher: "aes-xts-plain64"
        # Optional LUKS on all data volumes
        allowWeakPassphrase: false
    # Swap options
    swap:
        file: false
        partition: true
        size: 4096
        # Use zram instead of swap partition
        zram: true
        zramFraction: 0.5
        zramAlgorithm: "zstd"
    # Bootloader options
    bootloader:
        location: "/boot"
        efi: true
        efiSize: 512
        bios: true
        # GRUB options
        grub:
            distribute: false
            updateDefault: true
            nonInteractive: false
            force: true
            # GRUB themes
            theme: "solus-grub-theme"
            timeout: 5
            defaults: "quiet splash"
    # Advanced options
    advanced:
        alignment: "optimal"
        alignStart: 2048
        partitions:
            # EFI System Partition
            - name: "EFI System"
              type: "EFI System"
              size: "512M"
              filesystem: "fat32"
              mountPoint: "/boot/efi"
              flags:
                  - "esp"
                  - "boot"
            # Boot partition
            - name: "Boot"
              type: "Linux filesystem"
              size: "1G"
              filesystem: "ext4"
              mountPoint: "/boot"
            # Root BTRFS
            - name: "Root"
              type: "Linux filesystem"
              size: "100%FREE"
              filesystem: "btrfs"
              mountPoint: "/"

# =============================================================================
# Users Module
# =============================================================================

users:
    # User creation
    user:
        defaultGroupName: "users"
        defaultGroups:
            - wheel
            - users
            - storage
            - power
            - audio
            - video
            - docker
            - libvirt
            - kvm
            - input
            - lp
            - scanner
        setRootPassword: true
        doAutoLogin: false
        autologinGroup: "autologin"
        # Password requirements
        passwordRequirements:
            minLength: 6
            maxLength: 0
            allowWeakPasswords: false
            requireCapital: false
            requireNumber: false
            requireSpecial: false
        # User image
        avatarFilePath: ""
    # Root user
    root:
        setRootPassword: true
        doAutoLogin: false
        lockRoot: false
    # User defaults
    default:
        shell: "/bin/bash"
        timezone: "auto"
        language: "auto"
        country: "auto"
        locale: "auto"

# =============================================================================
# Display Manager
# =============================================================================

displaymanager:
    # Display manager selection based on edition
    # plasma: sddm, hyprland: sddm, gnome: gdm
    displaymanagers:
        - sddm
        - gdm
        - lightdm
    defaultDesktopEnvironment:
        plasma: "plasma"
        hyprland: "hyprland"
        gnome: "gnome"
    # Automated login
    autologin: false
    # Session configuration
    sessions:
        plasma: "plasma"
        hyprland: "hyprland"
        gnome: "gnome"
    # Alternative sessions
    alternativeSessions:
        plasma:
            - "plasmax11"
            - "kde-wayland"
        gnome:
            - "gnome-xorg"
            - "gnome-wayland"
    # Basic setup
    basicSetup: true
    # Greeter settings
    greeter:
        sddm:
            theme: "solus-sddm-theme"
            userList: true
            hideUsers: false
            enableNumlock: true
        gdm:
            theme: "solus-gdm-theme"
            autoSuspend: false
            logo: "solus-logo.png"
    # Default desktop
    defaultDesktop: "plasma"

# =============================================================================
# Network Configuration
# =============================================================================

networkcfg:
    # Hostname
    hostname: "solus-pc"
    # DHCP by default
    dhcp: true
    # Network manager
    backend: "NetworkManager"

# =============================================================================
# Services Module
# =============================================================================

services:
    # Services to enable
    enable:
        - NetworkManager
        - bluetooth
        - cups
        - avahi-daemon
        - sshd
        - fwupd
        - docker
        - containerd
        - podman
        - snapper-timeline
        - snapper-cleanup
        - btrfs-scrub@-
        - cronie
        - systemd-bootchart
        - solus-firstboot
    # Services to disable
    disable:
        - firewalld
        - kdump
        - postfix
        - sendmail
        - abrtd
        - abrt-journal-core
        - abrt-oops
        - abrt-vmcore
        - atd
        - auditd
    # Targets
    targets:
        - graphical.target

# =============================================================================
# Bootloader
# =============================================================================

bootloader:
    # Installation method
    installMethod: "grub"
    # GRUB configuration
    grub:
        installEFI: true
        installBoot: true
        forceEFI: false
        skipEFIBootEntry: false
        # GRUB theme
        theme: "solus-grub-theme"
        # Resolution
        grubResolution: "auto"
        gfxMode: "auto"
        # Default entry
        defaultEntry: "Solus Linux"
        # Kernel parameters
        kernelParams: "quiet splash"
        # Timeout
        timeout: 5
        # Recovery
        enableRecovery: true
        enableCryptodisk: true
    # EFI boot
    efi:
        loader: "grubx64.efi"
        entry: "Solus Linux"
        # Secure Boot
        secureBoot: false
        shim: false
    # Non-EFI (BIOS)
    bios:
        bootDevice: "/dev/sda"
        forceMBR: false

# =============================================================================
# Post-Install Hooks
# =============================================================================

shellprocess:
    # Scripts to run after installation, before reboot
    scripts:
        # Post-install configuration
        - name: "Solus Post-Install"
          command: "/usr/libexec/solus/post-install.sh"
          workingDirectory: "/"
          runLevel: "post-exec"
          runInTarget: true
          runAsUser: "root"
          timeout: 120

        # Hardware detection and optimization
        - name: "Hardware Detection"
          command: "/usr/libexec/solus/hardware-detect.sh"
          workingDirectory: "/"
          runLevel: "post-exec"
          runInTarget: true
          runAsUser: "root"
          timeout: 60

        # Apply Solus theming
        - name: "Apply Theming"
          command: "/usr/libexec/solus/apply-theme.sh"
          workingDirectory: "/"
          runLevel: "post-exec"
          runInTarget: true
          runAsUser: "root"
          timeout: 30

        # Configure default user settings
        - name: "User Defaults"
          command: "/usr/libexec/solus/user-defaults.sh"
          workingDirectory: "/"
          runLevel: "post-exec"
          runInTarget: true
          runAsUser: "root"
          timeout: 30

        # Enable Solus repository
        - name: "Enable Solus Repo"
          command: "/usr/libexec/solus/enable-repo.sh"
          workingDirectory: "/"
          runLevel: "post-exec"
          runInTarget: true
          runAsUser: "root"
          timeout: 30

        # Update initramfs
        - name: "Update Initramfs"
          command: "dracut --force --regenerate-all"
          workingDirectory: "/"
          runLevel: "post-exec"
          runInTarget: true
          runAsUser: "root"
          timeout: 60

# =============================================================================
# Finished Module
# =============================================================================

finished:
    # Reboot after install
    restartNowEnabled: true
    restartNowChecked: true
    # Show finish message
    show: true
    # Completion message
    message: >
        Installation complete!<br/>
        Your system will restart in a few seconds.<br/><br/>
        <b>Welcome to Solus Linux!</b><br/><br/>
        After reboot:
        <ul>
        <li>Log in with the user you created</li>
        <li>Run updates via the Software Center</li>
        <li>Visit <a href='https://getsol.us/welcome'>getsol.us/welcome</a> to get started</li>
        </ul>
    # Post-install actions
    actions:
        - "restart"
        - "eject"
        - "close"
