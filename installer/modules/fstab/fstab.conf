# Calamares FSTab Module Configuration
---
# Mount options per filesystem type
mountOptions:
  btrfs:
    - defaults
    - noatime
    - compress=zstd:3
    - space_cache=v2
    - commit=120
  ext4:
    - defaults
    - noatime
  xfs:
    - defaults
    - noatime
  f2fs:
    - defaults
    - noatime
  vfat:
    - umask=0077
  swap:
    - defaults

# SSD-specific mount options (override above for SSDs)
ssdMountOptions:
  btrfs:
    - defaults
    - noatime
    - compress=zstd:3
    - space_cache=v2
    - discard=async
    - commit=120
  ext4:
    - defaults
    - noatime
    - discard

# EFI partition mount options
efiMountOptions: umask=0077
