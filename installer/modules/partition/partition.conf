# Calamares Partition Module Configuration
---
# Allow manual partitioning and automatic schemes
allowManualPartitioning: true

# Available install choices
userChoices:
  - swap
  - fs
  - luks
  - lvm

# Automatic partitioning options
eraseEnableSwap: true
enableSwapfile: true
swapfileSizeMB: 8192

# Filesystem choices
availableFileSystems:
  - btrfs
  - ext4
  - xfs
  - f2fs
  - reiserfs

# Default filesystem — Btrfs for snapshot/rollback support
defaultFileSystemType: btrfs

# Btrfs subvolume configuration
btrfsSubvolumes:
  - name: "@"
    mountpoint: "/"
  - name: "@home"
    mountpoint: "/home"
  - name: "@snapshots"
    mountpoint: "/.snapshots"
  - name: "@var"
    mountpoint: "/var"

# Encryption options
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
luksCipher: aes-xts-plain64
luksKeySize: 512
luksPbkdf: argon2id


# Minimum partition sizes (GiB)
minimumPartSize:
  root: 20
  home: 5
  efi: 0.3

# Replace current partition layout
alwaysShowPartitionLabels: true
