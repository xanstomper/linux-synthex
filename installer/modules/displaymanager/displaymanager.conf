# Calamares Display Manager Module Configuration
---
# Display manager(s) to configure
displaymanagers:
  - sddm
  - gdm
  - lightdm

# Default display manager
defaultDisplayManager: sddm

# SDDM configuration
sddm:
  autoLoginUser: ""
  configurationFile: /etc/sddm.conf
  theme: solus-sddm-theme
  cursorTheme: Bibata-Modern-Classic

# GDM configuration
gdm:
  autoLoginUser: ""
  waylandEnable: true

# LightDM configuration
lightdm:
  autoLoginUser: ""
  greeter: lightdm-gtk-greeter
