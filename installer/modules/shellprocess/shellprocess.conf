# Calamares ShellProcess Module Configuration
---
# Post-install scripts run in the chroot target
scripts:
  - name: "Synthex Post-Install"
    command: "/usr/libexec/synthex/post-install.sh"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 120

  - name: "Hardware Detection"
    command: "/usr/libexec/synthex/hardware-detect.sh"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 60

  - name: "Apply Theming"
    command: "/usr/libexec/synthex/apply-theme.sh"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 30

  - name: "User Defaults"
    command: "/usr/libexec/synthex/user-defaults.sh"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 30

  - name: "Enable Synthex Repo"
    command: "/usr/libexec/synthex/enable-repo.sh"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 30

  - name: "Deploy Security Hardening"
    command: "/usr/libexec/synthex/security-deploy.sh"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 60

  - name: "Update Initramfs"
    command: "dracut --force --regenerate-all"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 60

  - name: "Update GRUB"
    command: "grub2-mkconfig -o /boot/grub2/grub.cfg"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 30
