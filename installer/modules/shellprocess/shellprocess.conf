# Calamares ShellProcess Module Configuration
---
# Post-install scripts run in the chroot target
scripts:
  - name: "Solus Post-Install"
    command: "/usr/libexec/solus/post-install.sh"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 120

  - name: "Hardware Detection"
    command: "/usr/libexec/solus/hardware-detect.sh"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 60

  - name: "Apply Theming"
    command: "/usr/libexec/solus/apply-theme.sh"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 30

  - name: "Update Initramfs"
    command: "dracut --force --regenerate-all"
    workingDirectory: "/"
    runInTarget: true
    runAsUser: "root"
    timeout: 60
