# Calamares Packages Module Configuration
# This runs during installation to install base system + profile packages.
---
# Package manager backend
backend: dnf

# Install the base meta-package for the selected profile.
# The synthexprofile module writes synthexProfile to global storage,
# and the packages module reads it to select the right meta-package.
install:
  - synthex-base

# Packages to install regardless of profile (always included):
additional_packages:
  # ── Core Synthex System Daemons ──
  - synthex-system-daemon
  - synthex-hwdaemon
  - synthex-desktopd
  - synthex-gpu-setupd
  - synthex-stored
  # ── Core CLI Tools ──
  - synthex-cli
  - synthex-pkg
  - synthex-update-manager
  - synthex-service-manager
  - synthex-kernel-manager
  - synthex-recovery
  - synthex-compat-db
  - synthex-app-installer
  - synthex-wine-manager
  - synthex-terminal-workspace
  - synthex-system-report
  - synthex-snapshot-manager
  # ── Desktop & Themes ──
  - synthex-desktop-common
  - synthex-themes
  - synthex-calamares-branding
  # ── OOBE ──
  - synthex-oobe
  # ── Security Hardening ──
  - synthex-security-deploy
  # ── VPN ──
  - synthex-vpn
  # ── Core System Packages ──
  - mesa
  - mesa-vulkan-drivers
  - pipewire
  - wireplumber
  - pavucontrol
  # ── Fonts ──
  - google-noto-sans-fonts
  - google-noto-color-emoji-fonts
  - google-noto-serif-fonts
  - google-noto-mono-fonts

# Remove live-only packages after install
remove:
  - calamares-live

# Package groups to install (comps XML groups defined in packages/groups/)
packageGroups:
  - synthex-core

# Update target system packages
updateDb: true
updateSystem: false
