# Calamares Packages Module Configuration
---
packageOperations:
  - install
  - remove
  - try_install
  - try_remove

# Package manager backend
backend: dnf

# Install via meta-packages
install:
  - solus-meta-standard

# Remove live-only packages after install
remove:
  - calamares-live

# Update target system packages
updateDb: true
updateSystem: false
