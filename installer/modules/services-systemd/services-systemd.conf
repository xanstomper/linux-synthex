# Calamares Services (systemd) Module Configuration
---
# Services to enable on target system
services:
  # ── Core System ──
  - name: NetworkManager
    action: enable
  - name: bluetooth
    action: enable
  - name: sddm
    action: enable
  - name: firewalld
    action: enable
  - name: fwupd
    action: enable
  - name: cups
    action: enable
  # ── Snapshot & BTRFS ──
  - name: snapper-timeline.timer
    action: enable
  - name: snapper-cleanup.timer
    action: enable
  - name: btrfs-scrub@-.timer
    action: enable
  # ── Synthex Daemons (only services that exist in systemd/) ──
  - name: synthex-system-daemon
    action: enable
  - name: synthex-hwdaemon
    action: enable
  - name: synthex-desktopd
    action: enable
  - name: synthex-gpu-setupd
    action: enable
  - name: synthex-stored
    action: enable
  # ── Synthex Services ──
  - name: synthex-oobe
    action: enable
  - name: synthex-safety
    action: enable
  - name: synthex-control-center
    action: enable
  - name: synthex-agent
    action: enable
  - name: synthex-snapshot-manager.timer
    action: enable
  - name: synthex-blueprint.timer
    action: enable
  - name: synthex-workspace
    action: enable
  - name: synthex-integration-engine
    action: enable
  # ── Synthex Target ──
  - name: synthex.target
    action: enable

# Targets to set as default
defaultTarget: graphical.target
