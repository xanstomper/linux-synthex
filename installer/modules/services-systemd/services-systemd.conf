# Calamares Services (systemd) Module Configuration
---
# Services to enable on target system
services:
  - name: NetworkManager
    action: enable
  - name: bluetooth
    action: enable
  - name: sddm
    action: enable
  - name: cups
    action: enable
  - name: avahi-daemon
    action: enable
  - name: sshd
    action: enable
  - name: fwupd
    action: enable
  - name: firewalld
    action: enable
  - name: snapper-timeline.timer
    action: enable
  - name: snapper-cleanup.timer
    action: enable
  - name: btrfs-scrub@-.timer
    action: enable
  - name: solus-safety
    action: enable
  - name: solus-slim
    action: enable
  - name: solus-oobe
    action: enable
  - name: solus-control-center
    action: enable
  - name: solus-hwdaemon
    action: enable
  - name: solus-gpu-setupd
    action: enable
  - name: solus-stored
    action: enable
  - name: solus-desktopd
    action: enable
  - name: solus-workspace
    action: enable
  - name: solus-webappd
    action: enable
  - name: solus-blueprint.timer
    action: enable
  - name: solus-ananicy
    action: enable
  - name: solus-agent
    action: enable
  - name: solus.target
    action: enable

# Targets to set as default
defaultTarget: graphical.target
