# Calamares Finished Module Configuration
---
# Offer reboot after install
restartNowEnabled: true
restartNowChecked: true

# Show message
show: true

# Message to display on completion
message: >
  Installation complete!<br/>
  Your system will restart in a few seconds.<br/><br/>
  <b>Welcome to Solus Linux!</b>

# Actions to offer
actions:
  - restart
  - eject
  - close
