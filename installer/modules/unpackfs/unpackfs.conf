# Calamares UnpackFS Module Configuration
---
# Source of the squashfs image
unpack:
  - source: "/run/install/repo/LiveOS/squashfs.img"
    sourcefs: squashfs
    destination: ""

# Ensure /run is not copied
excludePaths:
  - /run/*
  - /tmp/*
  - /var/cache/*
  - /var/log/*

# Number of parallel decompression threads
unpackThreads: 0  # auto-detect
