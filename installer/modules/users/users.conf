# Calamares Users Module Configuration
---
# Default user settings
defaultGroups:
  - users
  - wheel
  - audio
  - video
  - cdrom
  - docker
  - libvirt
  - kvm
  - input
  - storage
  - adm
  - networkmanager
  - lp

# Autologin options
doAutologin: true

# Set root password
setRootPassword: true

# Allow weak passwords (but warn)
allowWeakPasswords: false
allowWeakPasswordsDefault: false

# Hostname settings
hostnameLocation: firstUser  # Use username as default hostname

# Avatar settings
userAvatar: ":/images/synthex-avatar.png"

# Password requirements
passwordRequirements:
  minLength: 6
  maxLength: 120

# Do not reuse existing passwords
doReusePassword: true

# Shell for new user
userShell: /bin/bash
