# Calamares Bootloader Module Configuration
---
# Bootloader type: grub or systemd-boot
bootloaderType: grub

# Install for EFI or BIOS
efiMountPoint: /boot/efi
enableFallbackBootloader: true

# GRUB configuration
grubInstallOptions: "--bootloader-id=synthex"
grubConfigFile: /etc/default/grub
grubTheme: /usr/share/grub/themes/synthex/theme.txt

# Default kernel parameters
kernelParams: "quiet splash rd.driver.blacklist=nouveau modprobe.blacklist=nouveau"

# Timeout (seconds)
timeout: 5

# Enable recovery entry
enableRecovery: true

# Enable cryptodisk support
enableCryptodisk: true
