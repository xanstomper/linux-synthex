# Synthex ZRAM generator drop-in
# Installed to /usr/lib/systemd/zram-generator/zram-generator.conf.d/synthex.conf
# Sized to physical RAM; zstd compression; swap priority high so ZRAM is
# preferred over any disk swap. CachyOS-style.

[zram0]
zram-size = ram
compression = zstd
swap-priority = 100
fs-type = swap
