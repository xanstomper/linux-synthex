# Solus Linux performance sysctl drop-in
# Installed to /etc/sysctl.d/99-solus-performance.conf
# CachyOS-inspired desktop + gaming tuning. Override per-mode in modes/*.sh.

# ── VM / memory ──────────────────────────────────────────────────────────────
# ZRAM handles swap; keep swappiness low so anonymous pages stay in RAM.
vm.swappiness = 10
vm.watermark_boost_factor = 1
vm.watermark_scale_factor = 100
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.dirty_writeback_centisecs = 1500
vm.page_lock_unfairness = 1
vm.min_free_kbytes = 65536
# ZRAM is the swap path; disable zswap to avoid double compression overhead.
vm.zswap_enabled = 0
# Transparent HugePages: madvise only — no aggressive defrag/compaction stalls.
vm.thp_anon = madvise

# ── Scheduler ────────────────────────────────────────────────────────────────
# BORE/EEVDF desktop latency tuning.
kernel.sched_latency_ns = 6000000
kernel.sched_min_granularity_ns = 750000
kernel.sched_wakeup_granularity_ns = 1000000
kernel.sched_child_runs_first = 0
kernel.sched_migration_cost_ns = 500000
kernel.sched_nr_migrate = 128
kernel.sched_rt_runtime_us = 980000

# ── I/O ──────────────────────────────────────────────────────────────────────
# BFQ for rotational; none/mq-deadline for NVMe set per-device in udev.
vm.dirty_expire_centisecs = 3000

# ── Kernel ───────────────────────────────────────────────────────────────────
kernel.printk = 3 3 3 3
kernel.watchdog_thresh = 30
kernel.nmi_watchdog = 0
kernel.split_lock_mitigate = 0
kernel.kexec_load_disabled = 0

# ── Filesystem ───────────────────────────────────────────────────────────────
fs.aio-max-nr = 1048576
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# ── Networking (BBR + fq) ────────────────────────────────────────────────────
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 16384
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_no_metrics_save = 1

# ── Game compatibility ───────────────────────────────────────────────────────
# Raise the Steam/proton max map count.
vm.max_map_count = 16777216
