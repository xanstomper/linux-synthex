###############################################################################
# /etc/sysctl.conf
# Kernel hardening sysctl settings for Linux Synthex
#
# Applied by: systemd-sysctl (or sysctl.d)
# Order: /etc/sysctl.d/ > /run/sysctl.d/ > /usr/lib/sysctl.d/
# This file goes in /etc/sysctl.d/99-synthex-hardening.conf
#
# Reference:
#   - CIS Linux Benchmark v3.0
#   - Kernel Self-Protection Project recommendations
#   - KSPP recommended sysctl settings
#   - NSA Linux Hardening Guide
#
# IMPORTANT: Test changes before deploying to production.
#   sudo sysctl -p /etc/sysctl.d/99-synthex-hardening.conf
#
# For persistent changes, place in /etc/sysctl.d/
# For temporary runtime changes:
#   sysctl -w kernel.kptr_restrict=2
###############################################################################

#==============================================================================
# 1. KERNEL HARDENING AND INFORMATION DISCLOSURE
#==============================================================================

# Restrict kernel pointer exposure to privileged users only
# 0 = disabled, 1 = restrict, 2 = restrict for all users
kernel.kptr_restrict = 2

# Restrict dmesg access to privileged users (CAP_SYSLOG)
# 0 = disabled, 1 = restrict to CAP_SYSLOG admin, 2 = always restricted
kernel.dmesg_restrict = 1

# Restrict printk console loglevel to reduce kernel info leaks
# Format: console_loglevel default_loglevel minimum_loglevel default_console
# Values: 3=KERN_ERR, 4=KERN_WARNING, 7=KERN_DEBUG
kernel.printk = 3 3 3 3

# Prevent kernel image from being loaded from kexec (except signed)
# 0 = disabled, 1 = only images signed with trusted keys, 2 = kexec disabled
kernel.kexec_load_disabled = 1

# Disable kernel unprivileged BPF
# Prevents unprivileged users from loading BPF programs
kernel.unprivileged_bpf_disabled = 1

# Restrict perf_event_open to CAP_PERFMON privileged users
# 0 = unrestricted, 1 = restrict to CAP_PERFMON, 2 = always block
kernel.perf_event_paranoid = 3

# Restrict accessing /proc/<pid>/maps and /proc/<pid>/smaps
# 0 = disabled, 1 = restricted (owned by same UID), 2 = root only
kernel.maps_restrict = 1

# Disable the kernel's user-space helpers (hotplug, firmware loading)
# Prevents kernel from executing user-space handlers
kernel.hotplug = /sbin/hotplug
kernel.firmware_helper_disabled = 1

# Restrict the sysrq key
# 0 = disabled, 1 = enabled for all, 4 = enable only sysrq commands
# Recommended: 0 to disable entirely
kernel.sysrq = 0

#==============================================================================
# 2. MEMORY PROTECTION
#==============================================================================

# Enable kernel Page Table Isolation (PTI) for Meltdown mitigation
# Already compiled-in, but ensure it's not disabled at runtime

# Enable kernel stack randomization
# Value corresponds to the number of bits of randomized offset
kernel.randomize_va_space = 2

# Enable slab allocator freelist randomization
kernel.slab_freelist_random = 1

# Enable slab freelist hardening (metadata verification)
kernel.slab_freelist_hardened = 1

# Zero memory on allocation and free
# 0 = disabled, 1 = init_on_alloc, 2 = init_on_alloc + init_on_free
kernel.init_on_alloc = 1
kernel.init_on_free = 1

# Enable page allocator shuffling
kernel.page_alloc.shuffle = 1

# Stack clash protection (kernel)
kernel.stack_guard_gap = 256

# Enable the kernel's NX (non-executable) stack for BPF JIT
net.core.bpf_jit_enable = 1
net.core.bpf_jit_harden = 2

#==============================================================================
# 3. EXECUTABLE AND LINKING RESTRICTIONS
#==============================================================================

# Core dump handling
# 0 = disabled, 1 = partial, 2 = suid_dumpable (avoid)
kernel.core_uses_pid = 1
kernel.core_pipe_limit = 0

# Restrict ptrace scope
# 0 = any process can ptrace any other, 1 = restricted to descendants,
# 2 = only CAP_SYS_PTRACE, 3 = no ptrace
kernel.yama.ptrace_scope = 2

# Disable user namespaces (prevents namespace-based privilege escalation)
# 0 = disabled, 1 = enable user namespaces
# NOTE: Some container runtimes require user namespaces.
# Set to 0 if not using containers.
user.max_user_namespaces = 0

# Restrict the use of executable mappings
# 1 = don't allow mprotect to make mappings executable
vm.mmap_min_addr = 65536

#==============================================================================
# 4. NETWORK HARDENING (IPv4)
#==============================================================================

# Enable IP spoofing protection (reverse path filtering)
# 0 = No source validation, 1 = Strict mode as defined in RFC3704,
# 2 = Loose mode as defined in RFC3704
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP redirects (prevents MITM via ICMP)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Ignore ICMP redirects for IPv6
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Ignore source routed packets (prevents IP spoofing)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Enable TCP SYN cookies (SYN flood protection)
net.ipv4.tcp_syncookies = 1

# Disable TCP timestamps (reduces clock fingerprinting)
net.ipv4.tcp_timestamps = 0

# Enable TCP RFC 1337 (TIME-WAIT assassination protection)
net.ipv4.tcp_rfc1337 = 1

# Set maximum number of SYN backlog (SYN flood protection)
net.ipv4.tcp_max_syn_backlog = 2048

# Set SYN-ACK retries (reduce to limit resources)
net.ipv4.tcp_synack_retries = 2

# Set SYN retries (reduce to limit resources)
net.ipv4.tcp_syn_retries = 3

# Reduce FIN timeout (release resources faster)
net.ipv4.tcp_fin_timeout = 15

# Don't log bogus responses (RFC 1122 compliance)
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Disable ICMP echo broadcast (smurf attack protection)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Enable TCP window scaling (performance + security)
net.ipv4.tcp_window_scaling = 1

# Disable IP forwarding (unless system is a router)
net.ipv4.conf.all.forwarding = 0
net.ipv4.conf.default.forwarding = 0

# Disable martian packets (invalid source addresses)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Enable TCP Fast Open with restriction
# 0 = disabled, 1 = client only, 2 = client+server
net.ipv4.tcp_fastopen = 0

#==============================================================================
# 5. NETWORK HARDENING (IPv6)
#==============================================================================

# Disable IPv6 if not needed (uncomment to disable)
# net.ipv6.conf.all.disable_ipv6 = 1
# net.ipv6.conf.default.disable_ipv6 = 1

# Use privacy extensions for IPv6
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# Disable router advertisements (RA) unless needed
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Disable autoconfiguration
net.ipv6.conf.all.autoconf = 0
net.ipv6.conf.default.autoconf = 0

#==============================================================================
# 6. NETWORK HARDENING (Netfilter/Connection Tracking)
#==============================================================================

# Set connection tracking table size
net.netfilter.nf_conntrack_max = 262144

# Set connection tracking timeout values (reduce DoS window)
net.netfilter.nf_conntrack_tcp_timeout_established = 432000
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 120
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 30
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 30
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 60
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 60
net.netfilter.nf_conntrack_tcp_timeout_last_ack = 30

#==============================================================================
# 7. FILE SYSTEM AND MOUNT PROTECTION
#==============================================================================

# Restrict hardlink creation to owned files
# 0 = disabled, 1 = restrict to same UID with sticky bit consideration
fs.protected_hardlinks = 1

# Restrict symlink following in world-writable sticky directories
# 0 = disabled, 1 = restrict to same UID owner, 2 = restrict to directory owner
fs.protected_symlinks = 1

# Prevent opening files with O_NONBLOCK on FIFOs owned by other users
fs.protected_fifos = 2

# Prevent opening files with O_NONBLOCK on regular files owned by other users
fs.protected_regular = 2

# Restrict AHC (Aio Completion) to root only
fs.aio_max_nr = 1048576

# Disable user-triggered OOM notifications for non-privileged users
vm.oom_dump_tasks = 1
vm.overcommit_memory = 1
vm.panic_on_oom = 0
vm.overcommit_ratio = 50

#==============================================================================
# 8. KERNEL PANIC AND OOPS BEHAVIOR
#==============================================================================

# Reboot after kernel panic (seconds)
kernel.panic = 10

# Panic on oops (prevents continued execution after kernel error)
# 0 = continue, 1 = panic
kernel.panic_on_oops = 1

# Print kernel oops messages to console
kernel.oops_all_cpu = 1

#==============================================================================
# 9. SYSTEM PERFORMANCE AND RESOURCE LIMITS
#==============================================================================

# Max number of open files system-wide
fs.file-max = 1000000

# Max number of PIDs
kernel.pid_max = 65536

# Max number of threads per process
kernel.threads-max = 65536

# Set kernel.shm (shared memory) restrictions
kernel.shmmax = 68719476736
kernel.shmall = 4294967296

# Increase the maximum number of inotify watches
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 128

#==============================================================================
# 10. NETWORK PERFORMANCE (Security-Related)
#==============================================================================

# Increase max backlog for TCP connections
net.core.netdev_max_backlog = 5000
net.core.somaxconn = 4096

# Set socket buffer sizes
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304

# TCP buffer auto-tuning
net.ipv4.tcp_rmem = 4096 262144 4194304
net.ipv4.tcp_wmem = 4096 262144 4194304

# Disable TCP SACK (Selective Acknowledgment) to mitigate potential attacks
# NOTE: Commented out by default - disabling can impact performance.
# Re-enable if you need SACK for performance reasons but be aware of CVE risks.
# net.ipv4.tcp_sack = 0

# Disable TCP DSACK
net.ipv4.tcp_dsack = 0

#==============================================================================
# 11. BPF AND EBPF RESTRICTIONS
#==============================================================================

# Disable unprivileged BPF (already set above, reinforced here)
kernel.unprivileged_bpf_disabled = 1

# Hardening flags for BPF JIT (already set above)
net.core.bpf_jit_harden = 2

#==============================================================================
# 12. KERNEL MODULE LOADING
#==============================================================================

# Disable modules completely if not needed
# kernel.modules_disabled = 1

# Only allow modules signed with a valid key
# kernel.module.sig_enforce = 1

#==============================================================================
# 13. VIRTUAL MEMORY AND MMAP
#==============================================================================

# Disable MMAP minimal address randomization (already set above)
vm.mmap_min_addr = 65536

# Enable MMAP randomization (ASLR - already covered)
kernel.randomize_va_space = 2

#==============================================================================
# 14. WATCHDOG AND LIVENESS
#==============================================================================

# Enable hardware watchdog
kernel.nmi_watchdog = 1

# Disable soft lockup detection (re-enable for debugging)
kernel.softlockup_panic = 0

#==============================================================================
# 15. FILESYSTEM SPECIFIC
#==============================================================================

# Disable mounting of filesystems with unsafe mount flags
fs.suid_dumpable = 0

#==============================================================================
# 16. APPLY VERIFICATION
#==============================================================================
#
# After applying these settings, verify with:
#
#   sudo sysctl -p /etc/sysctl.d/99-synthex-hardening.conf
#
# Check critical settings:
#   sysctl kernel.kptr_restrict kernel.dmesg_restrict kernel.printk
#   sysctl kernel.randomize_va_space kernel.yama.ptrace_scope
#   sysctl net.ipv4.conf.all.rp_filter net.ipv4.tcp_syncookies
#   sysctl fs.protected_hardlinks fs.protected_symlinks
#
# Audit with:
#   sudo augenrules --check
#   sudo auditctl -l
#
# CIS benchmark compliance:
#   https://www.cisecurity.org/benchmark/linux
#
# Kernel Self-Protection Project:
#   https://kernsec.org/wiki/index.php/Kernel_Self_Protection_Project
#
