###############################################################################
# /etc/security/limits.conf
# Resource limits for security hardening
# Part of Linux Solus Security Architecture
#
# This file sets resource limits for all user sessions via PAM.
# Applied by: pam_limits.so
#
# Format:
#   <domain>  <type>  <item>  <value>
#
# Domain: user, group, or wildcard (*, %group)
# Type: hard (enforced), soft (warning), - (both)
# Item: core, data, fsize, memlock, nofile, rss, stack, cpu, nproc,
#       as, maxlogins, maxsyslogins, priority, locks, sigpending,
#       msgqueue, nice, rtprio, chroot
#
# Reference:
#   - limits.conf(5)
#   - CIS Linux Benchmark v3.0
#   - NIST SP 800-53 AC-3, AC-6
#
# WARNING: Do NOT set limits below the minimum required by system services.
# Test thoroughly with 'su - <user>' and 'ulimit -a' after changes.
###############################################################################

#==============================================================================
# 1. DEFAULT (WILDCARD) LIMITS - APPLIED TO ALL USERS
#==============================================================================

# Core file size limit: 0 disables core dumps entirely
# Core dumps can leak sensitive information (passwords, keys, memory contents)
*               hard    core            0
*               soft    core            0

# Maximum number of open file descriptors
# 1024 is safe for typical desktop/terminal use
# Increase for server workloads (e.g., web servers, databases)
*               hard    nofile          4096
*               soft    nofile          1024

# Maximum number of processes (nproc)
# 4096 prevents fork bombs while allowing normal operations
*               hard    nproc           4096
*               soft    nproc           2048

# Maximum stack size (in KB)
# 8192 KB (8 MB) is sufficient for most applications
# Too large risks stack clash vulnerabilities
*               hard    stack           8192
*               soft    stack           4096

# Maximum virtual memory (address space) in KB
# Unlimited by default; restrict for non-root to limit DoS potential
# *               hard    as             1048576   # 1 GB (commented for compatibility)
# *               soft    as             524288    # 512 MB

# Maximum data segment size in KB
# *               hard    data           1048576   # 1 GB
# *               soft    data           524288    # 512 MB

# Maximum resident set size (RSS) in KB
# 0 = unlimited (leave as 0 for desktop use)
# *               hard    rss            0
# *               soft    rss            0

# CPU time in minutes (0 = unlimited)
# *               hard    cpu            0
# *               soft    cpu            0

# Maximum number of pending signals
*               hard    sigpending      1024
*               soft    sigpending      512

# Maximum locked memory (for mlock) in KB
# 64 KB is enough for most apps that lock passwords/keys
*               hard    memlock         64
*               soft    memlock         64

#==============================================================================
# 2. ROOT USER LIMITS
#==============================================================================

# Root typically should have higher limits for system administration
root            hard    nofile          65536
root            soft    nofile          16384
root            hard    nproc           unlimited
root            soft    nproc           unlimited
root            hard    stack           16384
root            soft    stack           8192
root            hard    memlock         1024
root            soft    memlock         512

#==============================================================================
# 3. SYSTEM SERVICE USERS
#==============================================================================

# All system services (uid < 1000 or specified groups)

# SSHD: needs higher nproc for connection handling
sshd            hard    nproc           4096
sshd            soft    nproc           2048

# Systemd services
nobody          hard    nproc           256
nobody          soft    nproc           128

# Postfix/MTA users (if installed)
# postfix        hard    nofile          4096
# postfix        soft    nofile          2048

#==============================================================================
# 4. DATABASE AND APPLICATION SERVERS (if applicable)
#==============================================================================

# PostgreSQL (if installed)
# postgres       hard    nofile          65536
# postgres       soft    nofile          16384
# postgres       hard    nproc           4096
# postgres       soft    nproc           2048

# MySQL/MariaDB (if installed)
# mysql          hard    nofile          65536
# mysql          soft    nofile          16384
# mysql          hard    nproc           4096
# mysql          soft    nproc           2048

#==============================================================================
# 5. MAXIMUM LOGIN LIMITS
#==============================================================================

# Maximum number of simultaneous logins for a user
# Prevents resource exhaustion via multiple concurrent sessions
*               hard    maxlogins       10

# Maximum number of logins system-wide (excluding root)
*               hard    maxsyslogins    64

#==============================================================================
# 6. NICE AND REAL-TIME PRIORITY LIMITS
#==============================================================================

# Maximum nice priority (lower value = higher priority)
# Prevent unprivileged users from acquiring high CPU priority
*               hard    priority        0

# Maximum real-time priority
# Prevent unprivileged users from using real-time scheduling
*               hard    rtprio          0

# Maximum number of real-time signals queued
*               hard    sigpending      1024

#==============================================================================
# 7. POSIX MESSAGE QUEUE LIMITS
#==============================================================================

# Maximum POSIX message queue size (bytes)
*               hard    msgqueue        1048576
*               soft    msgqueue        65536

#==============================================================================
# 8. SPECIFIC USER/GROUP EXCEPTIONS (uncomment as needed)
#==============================================================================

# Allow developer user higher limits
# @developers    hard    nofile          65536
# @developers    soft    nofile          16384

# Allow admin group higher limits
# @admin         hard    nofile          4096
# @admin         soft    nofile          2048

# Allow monitoring user higher priority
# @monitoring    hard    rtprio          10

#==============================================================================
# 9. CHROOT ENVIRONMENTS
#==============================================================================

# Apply chroot jail for specific users (optional)
# Format: <username>  hard  chroot  <directory>
# Example:
# webuser         hard    chroot          /var/www/jails/webuser

#==============================================================================
# 10. APPLICATION-SPECIFIC LIMITS
#==============================================================================

# Web browsers (should not be able to exhaust system resources)
# @browser       hard    nproc           1024
# @browser       soft    nproc           512

#==============================================================================
# NOTES AND REFERENCES
#==============================================================================
#
# Testing your limits configuration:
#   $ su - testuser
#   $ ulimit -a
#   $ ulimit -c    # should be 0
#   $ ulimit -n    # should be 1024
#   $ ulimit -u    # should be 2048
#
# Check effective limits:
#   $ cat /proc/self/limits
#
# View limits of running process:
#   $ cat /proc/<PID>/limits
#
# PAM configuration for limits (/etc/pam.d/common-session):
#   session required pam_limits.so
#
# CIS benchmarks referenced:
#   5.1 - Set User/Group Defaults
#   5.2 - Restrict Core Dumps
#   5.3 - Restrict Stack Size
#   5.4 - Limit Number of Simultaneous Logins
#   5.5 - Limit Password Reuse
#   5.6 - Ensure default group for root is GID 0
#
# NIST 800-53 controls:
#   AC-3: Access Enforcement
#   AC-6: Least Privilege
#   SC-4: Information in Shared Resources
#   SI-13: Predictable Failure Prevention
#
###############################################################################
# End of file
