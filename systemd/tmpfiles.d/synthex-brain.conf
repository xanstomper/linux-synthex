# /usr/lib/tmpfiles.d/synthex-brain.conf
#
# Runtime directory layout for all Brain OS daemons.
# Applied at boot by systemd-tmpfiles-setup.service.
#
# Format: type  path                              mode  user           group          age   argument
#
# ── /run/synthex (parent, owned by root/synthex-brain) ───────────────────────
d  /run/synthex                                   0750  root           synthex-brain  -     -
# ── synthex-brain ─────────────────────────────────────────────────────────────
d  /run/synthex/brain                             0750  synthex-brain  synthex-brain  -     -
d  /var/lib/synthex                               0750  synthex-brain  synthex-brain  -     -
d  /var/lib/synthex/brain                         0700  synthex-brain  synthex-brain  -     -
d  /var/log/synthex                               0750  synthex-brain  synthex-brain  -     -
# ── synthex-neural-ipc ────────────────────────────────────────────────────────
d  /run/synthex/neural                            0750  synthex-brain  synthex-brain  -     -
# ── synthex-hermes ────────────────────────────────────────────────────────────
d  /run/synthex/hermes                            0750  synthex-brain  synthex-brain  -     -
# ── synthex-workspace-ai ──────────────────────────────────────────────────────
d  /run/synthex/workspace-ai                      0750  synthex-brain  synthex-brain  -     -
d  /var/lib/synthex/workspace-ai                  0700  synthex-brain  synthex-brain  -     -
# ── synthex-gaming-mode IPC socket directory ──────────────────────────────────
d  /run/synthex/gaming                            0750  root           synthex-brain  -     -
# Socket file itself is created by the gaming-mode daemon; just ensure the dir exists.
# ── /etc/synthex (key material) ───────────────────────────────────────────────
d  /etc/synthex                                   0750  root           synthex-brain  -     -
z  /etc/synthex/neural-ipc.key                    0640  root           synthex-brain  -     -
# ── Ephemeral scratch for tools called by Hermes ──────────────────────────────
d  /tmp/synthex-hermes                            0700  synthex-brain  synthex-brain  10d   -
