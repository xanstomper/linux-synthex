name: Build ISO (daily / release)

on:
  schedule:
    - cron: "0 6 * * *"  # daily 6am UTC
  workflow_dispatch:
    inputs:
      version:
        description: "ISO version tag"
        required: false
        default: "nightly"

jobs:
  build-iso-docker:
    name: Build Synthex ISO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ISO
        run: |
          sudo bash scripts/build-synthex.sh docker-build 2>&1 | tail -5
          sudo bash scripts/build-synthex.sh build-rootfs 2>&1 | tail -5

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: synthex-iso
          path: build/out/*.iso
          retention-days: 7
