# Synthex ISO Build Profile
# Edition: plasma | gnome | hyprland | minimal | gaming
# Variant: v3 (default) | v4 | generic

[ISO]
name=synthex
version=2026.10
release=1

[BUILD]
host_requirements=dnf,lorax,livemedia-creator,mkisofs,isohybrid,imagemagick,rust,cargo

[KERNEL]
boot_kernel=kernel
# Security: keep CPU mitigations ON (Spectre/Meltdown/L1TF/MDS/Retbleed).
# The gaming edition may opt into `mitigations=off threadirqs` per-session via
# synthex-gaming-mode, but the base image must never ship with them disabled.
boot_cmdline=quiet rhgb splash mitigations=auto

[LIVE]
# Live USB session.  The live user has no password (locked) and is only
# reachable via SDDM autologin on the live USB — NOT on the installed system.
default_user=liveuser
default_password=
persistent_home=true

[INSTALL]
default_edition=plasma
default_profile=focus
default_filesystem=btrfs
default_disk_layout=laptop
default_timezone=America/New_York
default_keyboard=us

[NETWORK]
default_hostname=synthex-live
enable_services=NetworkManager,firewalld,synthex-system-daemon,synthex-recovery.timer

[OUTPUT]
iso_name=synthex-{edition}-{version}-{variant}.iso
sha256=true
b2sum=true
sign=gpg
