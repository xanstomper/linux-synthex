# Synthex Dracut Configuration
# Controls initramfs generation for optimal boot
# Place in /etc/dracut.conf.d/synthex.conf

# Host-specific initramfs (smaller, faster)
hostonly="yes"
hostonly_cmdline="yes"

# Compress initramfs with zstd (fastest decompression)
compress="zstd"
compress_args="-1"

# Add kernel modules for Synthex
add_drivers+=" btrfs crc32c-intel crc32c_generic "
add_drivers+=" nvme ahci xhci-pci "
add_drivers+=" amdgpu i915 nvidia_drm nvidia_modeset nvidia "

# Add filesystem support
add_drivers+=" btrfs ext4 xfs vfat "

# Add LUKS/crypt support
add_drivers+=" dm_crypt dm_mod "

# Add network support (for remote unlocking)
add_drivers+=" e1000 e1000e igb ixgbe r8169 iwlwifi "

# Add Synthex recovery module
add_dracutmodules+=" synthex-recovery "

# Install additional binaries
install_items+=" /usr/bin/snapper /usr/bin/btrfs /usr/bin/grub2-editenv "

# Default kernel command line parameters
kernel_cmdline+=" rd.luks=1 rd.lvm=1 rd.auto=1 quiet splash "

# Do not compress the initramfs if using early microcode
early_microcode="yes"

# Persistent rules
persistent_policy="by-uuid"

# Debug options (uncomment for troubleshooting)
# log_level=7
# printk_devkmsg=on
