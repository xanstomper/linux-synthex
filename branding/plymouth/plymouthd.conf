# Synthex Plymouth Boot Splash Configuration
# Place in /etc/plymouth/plymouthd.conf

[Daemon]
# Theme to use (must be installed in /usr/share/plymouth/themes/)
Theme=synthex

# Show detailed messages during boot
ShowDelay=0

# Device timeout
DeviceTimeout=10

# Enable keyboard input for LUKS passphrase
EnableKeyboardInput=true

# Log to syslog
LogToSyslog=true

# Graceful fallback if theme fails
ThemeBlacklist=

# Allow verbose messages in non-splash mode
Verbose=false

# Splash mode (auto: show on boot, hide on shutdown/reboot)
SplashMode=auto
