# GRUB configuration for SynthOS
# Synthex-branded boot menu with themed appearance
#
# Generated by Synthex GRUB Theme v1.0
# Install: /etc/default/grub

# Basic GRUB settings
GRUB_TIMEOUT=10
GRUB_TIMEOUT_STYLE=menu
GRUB_DEFAULT=saved
GRUB_SAVEDEFAULT=true

# Synthex Theme
GRUB_THEME="/boot/grub/themes/synthex/theme.txt"

# Terminal and GFX settings
GRUB_TERMINAL_OUTPUT=gfxterm
GRUB_GFXMODE=1920x1080x32
GRUB_GFXPAYLOAD_LINUX=keep

# Synthex-branded GRUB background and colours
GRUB_BACKGROUND="/boot/grub/themes/synthex/background.png"
GRUB_COLOR_NORMAL="#E8E8F0/#16213E"
GRUB_COLOR_HIGHLIGHT="#FFB300/#1A1A2E"

# Synthex edition detection (fallback to default)
GRUB_DISTRIBUTOR="Synthex"

# Synthex entry customisation
GRUB_DISABLE_SUBMENU=y
GRUB_DISABLE_RECOVERY=false

# Kernel parameters
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.systemd.show_status=auto"

# Enable memory test
GRUB_HIDDEN_TIMEOUT=0

# OS detection (for dual-boot)
GRUB_DISABLE_OS_PROBER=false

# Theme resolution fallbacks
GRUB_GFXPAYLOAD_LINUX=1920x1080,1600x900,1366x768,1280x720,1024x768,auto

# Synthex menu entries with edition badges
# 40_custom entries generated by synthex-grub-editions script
GRUB_CUSTOM_HEADER="/etc/grub.d/40_synthex"

# Advanced options
GRUB_RECORDFAIL_TIMEOUT=30
