<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#0A0A14;stop-opacity:1"/>
      <stop offset="50%"  style="stop-color:#0D1020;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#141428;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#B87A00;stop-opacity:0"/>
      <stop offset="50%"  style="stop-color:#6C88A8;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#B87A00;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Subtle amber glow line -->
  <rect x="0" y="535" width="1920" height="10" fill="url(#glow)"/>
  <!-- Corner accents -->
  <line x1="60" y1="60" x2="160" y2="60"  stroke="#6C88A8" stroke-width="1.5" opacity="0.3"/>
  <line x1="60" y1="60" x2="60"  y2="160" stroke="#6C88A8" stroke-width="1.5" opacity="0.3"/>
  <line x1="1860" y1="60"  x2="1760" y2="60"  stroke="#6C88A8" stroke-width="1.5" opacity="0.3"/>
  <line x1="1860" y1="60"  x2="1860" y2="160" stroke="#6C88A8" stroke-width="1.5" opacity="0.3"/>
  <line x1="60"   y1="1020" x2="160"  y2="1020" stroke="#6C88A8" stroke-width="1.5" opacity="0.3"/>
  <line x1="60"   y1="1020" x2="60"   y2="920"  stroke="#6C88A8" stroke-width="1.5" opacity="0.3"/>
  <line x1="1860" y1="1020" x2="1760" y2="1020" stroke="#6C88A8" stroke-width="1.5" opacity="0.3"/>
  <line x1="1860" y1="1020" x2="1860" y2="920"  stroke="#6C88A8" stroke-width="1.5" opacity="0.3"/>
  <!-- SynthOS wordmark -->
  <text x="960" y="120" font-family="'Noto Sans', sans-serif" font-size="42" font-weight="700"
        fill="#B8D4FF" text-anchor="middle" opacity="0.9">SynthOS</text>
  <text x="960" y="150" font-family="'Noto Sans', sans-serif" font-size="16"
        fill="#6688AA" text-anchor="middle" opacity="0.7">Illuminate Your Desktop</text>
  <!-- Separator -->
  <line x1="720" y1="170" x2="1200" y2="170" stroke="#334455" stroke-width="1" opacity="0.5"/>
</svg>
