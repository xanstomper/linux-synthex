<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F1A"/>
      <stop offset="50%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#16213E"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB300;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#FFB300;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFB300;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FFB300;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FFB300;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- Hexagon grid pattern -->
  <g stroke="#FFB300" stroke-width="0.5" fill="none" opacity="0.03">
    <polygon points="960,50 1010,75 1010,125 960,150 910,125 910,75"/>
    <polygon points="810,200 860,225 860,275 810,300 760,275 760,225"/>
    <polygon points="1110,200 1160,225 1160,275 1110,300 1060,275 1060,225"/>
  </g>
  <!-- Center glow -->
  <circle cx="960" cy="440" r="300" fill="#FFB300" opacity="0.03"/>
  <circle cx="960" cy="440" r="150" fill="#FFB300" opacity="0.05"/>
  <!-- Synthex logo representation -->
  <circle cx="960" cy="400" r="60" fill="none" stroke="#FFB300" stroke-width="3"/>
  <circle cx="960" cy="400" r="25" fill="#FFB300"/>
  <line x1="960" y1="340" x2="960" y2="310" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="960" y1="460" x2="960" y2="490" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="900" y1="400" x2="870" y2="400" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="1020" y1="400" x2="1050" y2="400" stroke="#FFB300" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Subtle accent line -->
  <rect x="660" y="540" width="600" height="1" fill="url(#accent)"/>
  <!-- Text -->
  <text x="960" y="570" font-family="Inter, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="300">SynthOS</text>
  <text x="960" y="600" font-family="Inter, sans-serif" font-size="14" fill="#FFB300" text-anchor="middle" letter-spacing="3">ILLUMINATE YOUR DESKTOP</text>
</svg>
