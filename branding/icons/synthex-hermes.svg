<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#171D24"/>
      <stop offset="100%" style="stop-color:#2A2A4E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C88A8"/>
      <stop offset="100%" style="stop-color:#A8CC6A"/>
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="url(#accent)" stroke-width="3"/>
  <!-- Omega symbol (AI) -->
  <text x="64" y="82" text-anchor="middle" font-size="56" font-weight="bold" fill="url(#accent)" font-family="serif">Ω</text>
  <!-- Small circuit lines (AI/brain) -->
  <line x1="28" y1="40" x2="40" y2="48" stroke="#6C88A8" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="40" x2="88" y2="48" stroke="#6C88A8" stroke-width="1.5" opacity="0.5"/>
  <circle cx="26" cy="39" r="3" fill="#6C88A8" opacity="0.5"/>
  <circle cx="102" cy="39" r="3" fill="#6C88A8" opacity="0.5"/>
  <!-- Brain/nodes -->
  <circle cx="48" cy="42" r="2" fill="#8899AA" opacity="0.3"/>
  <circle cx="64" cy="36" r="2" fill="#8899AA" opacity="0.3"/>
  <circle cx="80" cy="42" r="2" fill="#8899AA" opacity="0.3"/>
</svg>
